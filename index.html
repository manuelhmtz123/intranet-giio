function popOptions(selectedId){
  const pops = DATA.infra.pops || [];
  if(pops.length===0) return `<option value="">— No hay Pops registrados —</option>`;
  return `<option value="">Selecciona un sitio…</option>` + pops.map(p=>
    `<option value="${p.id}" ${String(p.id)===String(selectedId)?"selected":""}>${esc(p.nombre)}${p.ciudad?` (${esc(p.ciudad)})`:""}</option>`
  ).join("");
}
function popNombre(popId){
  const p = (DATA.infra.pops||[]).find(x=>String(x.id)===String(popId));
  return p ? p.nombre : "(Pop eliminado)";
}
function minisplitLabel(m){
  const partes = [popNombre(m.popId)];
  if(m.ubicacion) partes.push(m.ubicacion);
  const marcaModelo = [m.marca, m.modelo].filter(Boolean).join(" ");
  let label = partes.join(" — ");
  if(marcaModelo) label += ` (${marcaModelo})`;
  return label;
}
function minisplitOptions(selectedId){
  const list = DATA.infra.airesMinisplits || [];
  if(list.length===0) return `<option value="">— No hay minisplits registrados —</option>`;
  return `<option value="">Selecciona un minisplit…</option>` + list.map(m=>
    `<option value="${m.id}" ${String(m.id)===String(selectedId)?"selected":""}>${esc(minisplitLabel(m))}</option>`
  ).join("");
}
function addDaysISO(fechaISO, days){
  if(!fechaISO) return "";
  const d = new Date(fechaISO+"T00:00:00");
  if(isNaN(d.getTime())) return "";
  d.setDate(d.getDate() + (Number(days)||0));
  return d.toISOString().slice(0,10);
}
function fmtFechaCorta(fechaISO){
  if(!fechaISO) return "—";
  const d = new Date(fechaISO+"T00:00:00");
  if(isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function accionesDisplay(rec){
  const list = (rec.acciones||[]).filter(a=>a!=="Otro");
  if((rec.acciones||[]).includes("Otro") && rec.accionesOtro) list.push(rec.accionesOtro);
  return list.length ? list.join(", ") : "—";
}
function estadoAire(m){
  if(!m.fechaUltimoMantenimiento) return {cls:"grey", label:"Sin mantenimiento registrado"};
  if(!m.proximoMantenimientoRecomendado) return {cls:"grey", label:"Sin próxima fecha"};
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const prox = new Date(m.proximoMantenimientoRecomendado+"T00:00:00");
  const days = Math.round((prox - hoy) / 86400000);
  if(days < 0) return {cls:"red", label:`Vencido hace ${Math.abs(days)} día(s)`};
  if(days <= 30) return {cls:"amber", label: days===0 ? "Vence hoy" : `Vence en ${days} día(s)`};
  return {cls:"green", label:"Al día"};
}
function recomputeMinisplitFromHistory(minisplitId){
  const m = (DATA.infra.airesMinisplits||[]).find(x=>String(x.id)===String(minisplitId));
  if(!m) return;
  const hist = (DATA.infra.mantenimientosAires||[]).filter(x=>String(x.minisplitId)===String(minisplitId));
  if(hist.length===0){
    m.fechaUltimoMantenimiento = "";
    m.proximoMantenimientoRecomendado = m.fechaInstalacion ? addDaysISO(m.fechaInstalacion, m.frecuenciaRecomendadaDias||90) : "";
    m.ultimasAcciones = "";
    m.ultimasObservaciones = "";
    return;
  }
  hist.sort((a,b)=> (a.fecha||"").localeCompare(b.fecha||""));
  const last = hist[hist.length-1];
  m.fechaUltimoMantenimiento = last.fecha || "";
  m.ultimasAcciones = accionesDisplay(last);
  m.ultimasObservaciones = last.observaciones || "";
  m.proximoMantenimientoRecomendado = last.proximoMantenimientoRecomendado || addDaysISO(last.fecha, m.frecuenciaRecomendadaDias||90);
  m.fechaSugerida = false;
}

function renderAires(){
  const content = document.getElementById("content");
  const editable = canEdit();
  const minisplits = DATA.infra.airesMinisplits || [];
  const historial = DATA.infra.mantenimientosAires || [];

  const vencidos = minisplits.filter(m=>estadoAire(m).cls==="red").length;
  const proximos = minisplits.filter(m=>estadoAire(m).cls==="amber").length;
  const sinRegistro = minisplits.filter(m=>estadoAire(m).cls==="grey").length;
  const costoTotal = historial.reduce((s,h)=>s+(Number(h.costo)||0),0);
  const anioActual = new Date().getFullYear();
  const costoAnioActual = historial.reduce((s,h)=>{
    const anio = h.fecha ? Number(h.fecha.slice(0,4)) : null;
    return s + (anio===anioActual ? (Number(h.costo)||0) : 0);
  }, 0);

  content.innerHTML = `
    <div class="budget-summary">
      <div class="budget-pill"><label>Minisplits registrados</label><div class="amt">${minisplits.length}</div></div>
      <div class="budget-pill"><label>Mantenimiento vencido</label><div class="amt ${vencidos>0?'over':''}">${vencidos}</div></div>
      <div class="budget-pill"><label>Próximos a vencer (≤30 días)</label><div class="amt ${proximos>0?'warn':''}">${proximos}</div></div>
      <div class="budget-pill"><label>Sin mantenimiento registrado</label><div class="amt">${sinRegistro}</div></div>
      <div class="budget-pill"><label>Servicios registrados</label><div class="amt">${historial.length}</div></div>
      <div class="budget-pill"><label>Costo invertido (${anioActual})</label><div class="amt">${fmtMoney(costoAnioActual)}</div></div>
      <div class="budget-pill"><label>Costo invertido (histórico)</label><div class="amt">${fmtMoney(costoTotal)}</div></div>
    </div>
    <div class="footer-note" style="margin-bottom:10px;">Haz clic en "Historial" para ver todos los servicios de un equipo, su costo, proveedor, supervisor y el reporte adjunto.</div>
    <div class="table-wrap tall">
      <table>
        <thead><tr>
          <th>#</th><th style="min-width:170px;">Sitio (Pop)</th><th>Ubicación</th><th>Capacidad</th>
          <th>Fecha último mantenimiento</th><th style="min-width:200px;">Últimas acciones realizadas</th>
          <th style="min-width:180px;">Observaciones</th><th>Próximo mantenimiento recomendado</th><th>Estado</th><th></th>
        </tr></thead>
        <tbody id="tbody-aires"></tbody>
      </table>
    </div>
  `;

  const tbody = document.getElementById("tbody-aires");
  if(minisplits.length===0){
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:var(--muted); padding:24px;">Sin minisplits registrados.${editable?' Usa "+ Agregar Minisplit" para comenzar.':''}</td></tr>`;
    return;
  }

  minisplits.forEach((m, idx)=>{
    const st = estadoAire(m);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="idcol">${idx+1}</td>
      <td><b>${esc(popNombre(m.popId))}</b></td>
      <td>${esc(m.ubicacion||"—")}</td>
      <td>${esc(m.capacidad||"—")}</td>
      <td class="mono">${fmtFechaCorta(m.fechaUltimoMantenimiento)}</td>
      <td>${esc(m.ultimasAcciones||"—")}</td>
      <td>${esc(m.ultimasObservaciones||"—")}</td>
      <td class="mono">${fmtFechaCorta(m.proximoMantenimientoRecomendado)}</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td style="white-space:nowrap;">
        <button class="link-btn" data-hist="1">Historial</button>
        ${editable ? `<button class="link-btn" data-edit="1">Editar</button>` : ""}
        ${editable ? `<button class="link-btn" style="color:var(--red);" data-del="1">Eliminar</button>` : ""}
      </td>
    `;
    tbody.appendChild(tr);
    tr.querySelector("[data-hist]").addEventListener("click", ()=>openHistorialAireModal(m));
    const editBtn = tr.querySelector("[data-edit]");
    if(editBtn) editBtn.addEventListener("click", ()=>openMinisplitModal(m));
    const delBtn = tr.querySelector("[data-del]");
    if(delBtn) delBtn.addEventListener("click", ()=>{
      if(!confirm(`¿Eliminar el minisplit de "${popNombre(m.popId)}"${m.ubicacion?' — '+m.ubicacion:''}? También se eliminará su historial de mantenimientos.`)) return;
      DATA.infra.airesMinisplits = DATA.infra.airesMinisplits.filter(x=>x.id!==m.id);
      DATA.infra.mantenimientosAires = DATA.infra.mantenimientosAires.filter(x=>x.minisplitId!==m.id);
      saveData();
      renderAires();
    });
  });
}

  }

      </div>
    </div>
    <div class="modal-field"><label>Próxima fecha recomendada</label><input type="date" id="mm-proxima" value="${addDaysISO(hoy,90)}"></div>
    <div class="modal-field"><label>Observaciones</label><textarea id="mm-obs" rows="3" placeholder="Hallazgos, condición del equipo, recomendaciones…"></textarea></div>

      <div class="file-drop">
        <label class="btn upload-btn-label" style="margin:0;">

          <input type="file" id="mm-file" accept=".pdf,.jpg,.jpeg,.png" style="display:none;">

      <button class="btn btn-ghost" id="mm-cancel">Cancelar</button>

    </div>
  `;

  overlay.querySelector("#mm-cancel").addEventListener("click", closeModal);

  const otroChk = overlay.querySelector('.mm-accion[value="Otro"]');

  if(otroChk){
    otroChk.addEventListener("change", ()=>{ otroInput.style.display = otroChk.checked ? "block" : "none"; });
  }

  function updateProximaSugerida(){
    const fecha = overlay.querySelector("#mm-fecha").value;
    const minisplitId = overlay.querySelector("#mm-minisplit").value;
    const m = list.find(x=>String(x.id)===String(minisplitId));
    const dias = m ? (m.frecuenciaRecomendadaDias||90) : 90;
    if(fecha) overlay.querySelector("#mm-proxima").value = addDaysISO(fecha, dias);
  }
  overlay.querySelector("#mm-fecha").addEventListener("change", updateProximaSugerida);
  overlay.querySelector("#mm-minisplit").addEventListener("change", updateProximaSugerida);

  let selectedFile = null;
  overlay.querySelector("#mm-file").addEventListener("change", (e)=>{

    const fecha = overlay.querySelector("#mm-fecha").value;

    const accionesOtro = overlay.querySelector("#mm-otro").value.trim();
    if(acciones.includes("Otro") && !accionesOtro){

    const rec = {
      id: newId(),
      minisplitId,
      fecha,
      tipoServicio: overlay.querySelector("#mm-tipo").value,
      acciones,
      accionesOtro,
      costo: Number(overlay.querySelector("#mm-costo").value)||0,

      supervisorFibranet: overlay.querySelector("#mm-supervisor").value.trim(),
      proximoMantenimientoRecomendado: overlay.querySelector("#mm-proxima").value,
      observaciones: overlay.querySelector("#mm-obs").value.trim(),
      adjuntoNombre: "", adjuntoUrl: "",
      registradoPor: CURRENT_USER.nombre || CURRENT_USER.username,
      registradoEn: new Date().toISOString()
    };

    if(selectedFile){
      submitBtn.textContent = "Subiendo archivo…";
      try{
        const path = `mantenimientos-aires/${rec.id}-${selectedFile.name}`;
        const snap = await storage.ref(path).put(selectedFile);
        const url = await snap.ref.getDownloadURL();
        rec.adjuntoNombre = selectedFile.name;
        rec.adjuntoUrl = url;
      }catch(err){
        console.error("Error subiendo adjunto a Firebase Storage:", err);
        const seguir = confirm(
          "No se pudo subir el archivo adjunto (verifica que las reglas de Firebase Storage permitan escritura). " +
          "¿Deseas guardar el mantenimiento SIN el archivo adjunto? Cancelar para intentar de nuevo."
        );
        if(!seguir){
          submitBtn.disabled = false;
          submitBtn.textContent = originalLabel;
          return;
        }
      }
    }

    DATA.infra.mantenimientosAires.push(rec);
    recomputeMinisplitFromHistory(minisplitId);
    saveData();
    closeModal();
    renderAires();
  });
}

}

/* =========================================================================
   MANTENIMIENTOS — CALENDARIO, PROGRAMACIÓN ESCALONADA Y DASHBOARD EJECUTIVO
   (agrega Aires Acondicionados + Generadores de Emergencia en una sola vista)
========================================================================= */
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* Sugiere una fecha de próximo mantenimiento escalonada (no todas el mismo día)
   solo para equipos que NO tienen fecha de instalación ni historial de servicio,
   es decir, equipos sin ninguna referencia para calcular su próxima fecha.
   No sobreescribe nunca una fecha ya calculada o capturada — es 100% no destructivo,
   igual que la sincronización de Pops. La fecha queda marcada como "sugerida" y
   puede ajustarse en cualquier momento por el Administrador desde el calendario. */
function sugerirProgramacionEscalonada(){
  let changed = false;
  const STAGGER_DIAS = 5;
  const INICIO_DIAS = 14;
  let slot = 0;
  (DATA.infra.airesMinisplits||[]).forEach(m=>{
    if(!m.proximoMantenimientoRecomendado && !m.fechaInstalacion && !m.fechaUltimoMantenimiento){
      m.proximoMantenimientoRecomendado = addDaysISO(todayISO(), INICIO_DIAS + slot*STAGGER_DIAS);
      m.fechaSugerida = true;
      slot++;
      changed = true;
    }
  });
  (DATA.infra.generadores||[]).forEach(g=>{
    if(!g.proximoMantenimientoRecomendado && !g.fechaInstalacion && !g.fechaUltimoMantenimiento){
      g.proximoMantenimientoRecomendado = addDaysISO(todayISO(), INICIO_DIAS + slot*STAGGER_DIAS);
      g.fechaSugerida = true;
      slot++;
      changed = true;
    }
  });
  return changed;
}

/* Semáforo por fecha (no por si tiene o no historial) — para el calendario y la
   lista de pendientes: verde = lejos, ámbar = se acerca (≤30 días), rojo = vencido. */
function estadoPorFecha(fechaISO){
  if(!fechaISO) return {cls:"grey", label:"Sin fecha"};
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const d = new Date(fechaISO+"T00:00:00");
  if(isNaN(d.getTime())) return {cls:"grey", label:"Sin fecha"};
  const days = Math.round((d - hoy) / 86400000);
  if(days < 0) return {cls:"red", label:`Vencido hace ${Math.abs(days)} día(s)`};
  if(days <= 30) return {cls:"amber", label: days===0 ? "Vence hoy" : `Vence en ${days} día(s)`};
  return {cls:"green", label:"Al día"};
}

function collectMantenimientosProgramados(){
  const list = [];
  (DATA.infra.airesMinisplits||[]).forEach(m=>{
    if(!m.proximoMantenimientoRecomendado) return;
    const est = estadoPorFecha(m.proximoMantenimientoRecomendado);
    list.push({
      tipo:"aire", tipoLabel:"Aire Acondicionado", unitId:m.id, unit:m,
      sitio: popNombre(m.popId), equipo: [m.marca,m.modelo].filter(Boolean).join(" ") || (m.ubicacion||"Minisplit"),
      fecha: m.proximoMantenimientoRecomendado, cls: est.cls, label: est.label,
      sugerido: !!m.fechaSugerida
    });
  });
  (DATA.infra.generadores||[]).forEach(g=>{
    if(!g.proximoMantenimientoRecomendado) return;
    const est = estadoPorFecha(g.proximoMantenimientoRecomendado);
    list.push({
      tipo:"generador", tipoLabel:"Generador de Emergencia", unitId:g.id, unit:g,
      sitio: popNombre(g.popId), equipo: [g.marca,g.modelo].filter(Boolean).join(" ") || (g.ubicacion||"Generador"),
      fecha: g.proximoMantenimientoRecomendado, cls: est.cls, label: est.label,
      sugerido: !!g.fechaSugerida
    });
  });
  list.sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  return list;
}

let CAL_ANIO = null;
let CAL_MES = null;
const URGENCIA_ORDEN = {red:0, amber:1, grey:2, green:3};

function renderMantCalendario(){
  const content = document.getElementById("content");
  if(CAL_ANIO===null){ const hoy=new Date(); CAL_ANIO=hoy.getFullYear(); CAL_MES=hoy.getMonth(); }
  const admin = isAdmin();
  const eventos = collectMantenimientosProgramados();

  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DOW = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const primerDia = new Date(CAL_ANIO, CAL_MES, 1);
  const diasEnMes = new Date(CAL_ANIO, CAL_MES+1, 0).getDate();
  let startOffset = primerDia.getDay();
  startOffset = (startOffset===0) ? 6 : startOffset-1;
  const hoyStr = todayISO();

  const eventosPorDia = {};
  eventos.forEach(ev=>{ (eventosPorDia[ev.fecha] = eventosPorDia[ev.fecha]||[]).push(ev); });

  let celdas = "";
  for(let i=0;i<startOffset;i++){ celdas += `<div class="cal-cell outside"></div>`; }
  for(let d=1; d<=diasEnMes; d++){
    const fechaStr = `${CAL_ANIO}-${String(CAL_MES+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const evs = (eventosPorDia[fechaStr]||[]).slice().sort((a,b)=>URGENCIA_ORDEN[a.cls]-URGENCIA_ORDEN[b.cls]);
    const maxShow = 3;
    celdas += `<div class="cal-cell ${fechaStr===hoyStr?'today':''}" data-fecha="${fechaStr}">
      <div class="cal-daynum">${d}</div>
      ${evs.slice(0,maxShow).map(ev=>`<div class="cal-event ${ev.cls}" data-fecha="${fechaStr}" title="${esc(ev.sitio)} — ${esc(ev.tipoLabel)} (${esc(ev.label)})">${esc(ev.sitio)}</div>`).join("")}
      ${evs.length>maxShow ? `<div class="cal-event-more" data-fecha="${fechaStr}">+${evs.length-maxShow} más</div>` : ""}
    </div>`;
  }
  const totalCeldas = startOffset + diasEnMes;
  const trailing = (7 - (totalCeldas % 7)) % 7;
  for(let i=0;i<trailing;i++){ celdas += `<div class="cal-cell outside"></div>`; }

  const pendientes = eventos.slice().sort((a,b)=>{
    const u = URGENCIA_ORDEN[a.cls]-URGENCIA_ORDEN[b.cls];
    return u!==0 ? u : (a.fecha||"").localeCompare(b.fecha||"");
  });
  const vencidos = eventos.filter(e=>e.cls==="red").length;
  const proximos = eventos.filter(e=>e.cls==="amber").length;

  content.innerHTML = `
    <div class="budget-summary">
      <div class="budget-pill"><label>Mantenimientos programados</label><div class="amt">${eventos.length}</div></div>
      <div class="budget-pill"><label>Vencidos</label><div class="amt ${vencidos>0?'over':''}">${vencidos}</div></div>
      <div class="budget-pill"><label>Próximos a vencer (≤30 días)</label><div class="amt ${proximos>0?'warn':''}">${proximos}</div></div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="cal-header">
        <h2>${MESES[CAL_MES]} ${CAL_ANIO}</h2>
        <div class="cal-nav">
          <button class="cal-nav-btn" id="cal-prev">‹</button>
          <button class="cal-nav-today" id="cal-hoy">Hoy</button>
          <button class="cal-nav-btn" id="cal-next">›</button>
        </div>
      </div>
      <div class="cal-legend">
        <span><span class="dot" style="background:var(--green);"></span>Lejos de vencer (&gt;30 días)</span>
        <span><span class="dot" style="background:var(--amber);"></span>Se acerca (≤30 días)</span>
        <span><span class="dot" style="background:var(--red);"></span>Vencido</span>
      </div>
      <div class="cal-grid">
        ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("")}
        ${celdas}
      </div>
      <div class="footer-note">Haz clic en un día o en un mantenimiento para ver el detalle${admin?' y reprogramar':''}.</div>
    </div>

    <div class="section-header"><div class="proj-title-wrap"><h2 style="font-size:16px;">Lista de mantenimientos pendientes</h2></div></div>
    <div class="table-wrap tall">
      <table>
        <thead><tr>
          <th>Fecha</th><th>Estado</th><th>Tipo</th><th style="min-width:170px;">Sitio</th><th>Equipo</th><th>Origen</th><th></th>
        </tr></thead>
        <tbody id="tbody-mant-pend"></tbody>
      </table>
    </div>
  `;

  content.querySelectorAll(".cal-cell[data-fecha]").forEach(el=>{
    el.addEventListener("click", ()=>openDiaMantenimientoModal(el.dataset.fecha));
  });
  document.getElementById("cal-prev").addEventListener("click", ()=>{ CAL_MES--; if(CAL_MES<0){CAL_MES=11; CAL_ANIO--;} renderMantCalendario(); });
  document.getElementById("cal-next").addEventListener("click", ()=>{ CAL_MES++; if(CAL_MES>11){CAL_MES=0; CAL_ANIO++;} renderMantCalendario(); });
  document.getElementById("cal-hoy").addEventListener("click", ()=>{ const hoy=new Date(); CAL_ANIO=hoy.getFullYear(); CAL_MES=hoy.getMonth(); renderMantCalendario(); });

  const tbody = document.getElementById("tbody-mant-pend");
  if(pendientes.length===0){
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:24px;">No hay mantenimientos programados.</td></tr>`;
  } else {
    pendientes.forEach(ev=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="mono">${fmtFechaCorta(ev.fecha)}</td>
        <td><span class="badge ${ev.cls}">${esc(ev.label)}</span></td>
        <td>${esc(ev.tipoLabel)}</td>
        <td><b>${esc(ev.sitio)}</b></td>
        <td>${esc(ev.equipo||"—")}</td>
        <td>${ev.sugerido ? '<span class="footer-note" style="margin:0;">Sugerido</span>' : '<span class="footer-note" style="margin:0;">Calculado</span>'}</td>
        <td style="white-space:nowrap;">
          <button class="link-btn" data-hist="1">Historial</button>
          ${admin ? `<button class="link-btn" data-reprog="1">Reprogramar</button>` : ""}
        </td>
      `;
      tbody.appendChild(tr);
      tr.querySelector("[data-hist]").addEventListener("click", ()=>{
        if(ev.tipo==="aire") openHistorialAireModal(ev.unit); else openHistorialGeneradorModal(ev.unit);
      });
      const rp = tr.querySelector("[data-reprog]");
      if(rp) rp.addEventListener("click", ()=>openReprogramarModal(ev));
    });
  }
}

/* ---------- Mantenimientos — Resumen Ejecutivo (Q, mes, costo, sitio) ---------- */
let MANT_ANIO_FILTRO = null;
const MESES_CORTO = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function combinarHistorialMantenimientos(){
  const aires = (DATA.infra.mantenimientosAires||[]).map(h=>({...h, tipo:"aire", tipoLabel:"Aires Acondicionados",
    unit:(DATA.infra.airesMinisplits||[]).find(x=>String(x.id)===String(h.minisplitId))}));
  const generadores = (DATA.infra.mantenimientosGeneradores||[]).map(h=>({...h, tipo:"generador", tipoLabel:"Generadores de Emergencia",
    unit:(DATA.infra.generadores||[]).find(x=>String(x.id)===String(h.generadorId))}));
  return aires.concat(generadores);
}

function computeMantenimientosResumen(anio){
  const todos = combinarHistorialMantenimientos();
  const delAnio = todos.filter(h=>h.fecha && Number(h.fecha.slice(0,4))===anio);

  const costoAnio = delAnio.reduce((s,h)=>s+(Number(h.costo)||0),0);
  const costoTotal = todos.reduce((s,h)=>s+(Number(h.costo)||0),0);
  const promedioAnio = delAnio.length ? costoAnio/delAnio.length : 0;

  const conteoTipoServicio = {};
  TIPOS_SERVICIO_AIRE.forEach(t=>{ conteoTipoServicio[t] = delAnio.filter(h=>h.tipoServicio===t).length; });

  const costoPorQ = {Q1:0,Q2:0,Q3:0,Q4:0};
  delAnio.forEach(h=>{
    const mes = Number(h.fecha.slice(5,7));
    costoPorQ["Q"+Math.ceil(mes/3)] += (Number(h.costo)||0);
  });
  const qRows = ["Q1","Q2","Q3","Q4"].map(q=>({label:q, value:costoPorQ[q]}));
  const maxQ = Math.max(1, ...qRows.map(r=>r.value));

  const costoPorMes = Array(12).fill(0);
  delAnio.forEach(h=>{ costoPorMes[Number(h.fecha.slice(5,7))-1] += (Number(h.costo)||0); });
  const mesRows = MESES_CORTO.map((label,idx)=>({label, value:costoPorMes[idx]}));
  const maxMes = Math.max(1, ...mesRows.map(r=>r.value));

  const costoPorTipoEquipo = {
    "Aires Acondicionados": delAnio.filter(h=>h.tipo==="aire").reduce((s,h)=>s+(Number(h.costo)||0),0),
    "Generadores de Emergencia": delAnio.filter(h=>h.tipo==="generador").reduce((s,h)=>s+(Number(h.costo)||0),0)
  };

  const costoPorTipoServicio = {};
  TIPOS_SERVICIO_AIRE.forEach(t=>{ costoPorTipoServicio[t] = delAnio.filter(h=>h.tipoServicio===t).reduce((s,h)=>s+(Number(h.costo)||0),0); });
  const maxTipoServicio = Math.max(1, ...Object.values(costoPorTipoServicio));

  const costoPorSitio = {};
  delAnio.forEach(h=>{
    const sitio = h.unit ? popNombre(h.unit.popId) : "Sin sitio";
    costoPorSitio[sitio] = (costoPorSitio[sitio]||0) + (Number(h.costo)||0);
  });
  const sitiosOrdenados = Object.keys(costoPorSitio).sort((a,b)=>costoPorSitio[b]-costoPorSitio[a]);
  const maxSitio = Math.max(1, ...sitiosOrdenados.map(s=>costoPorSitio[s]));

  const aniosDisponibles = Array.from(new Set(todos.filter(h=>h.fecha).map(h=>Number(h.fecha.slice(0,4)))));

  return { delAnio, costoAnio, costoTotal, promedioAnio, conteoTipoServicio, qRows, maxQ, mesRows, maxMes,
    costoPorTipoEquipo, costoPorTipoServicio, maxTipoServicio, sitiosOrdenados, costoPorSitio, maxSitio, aniosDisponibles };
}

  const content = document.getElementById("content");

function downloadMantenimientosExcel(){

    "Costo": h.costo||0,
    "Moneda": h.moneda||"",

    "Observaciones": h.observaciones||"",
    "Registrado por": h.registradoPor||""

}

/* =========================================================================
   VEHICULOS — FLOTILLA (dashboard de kilometraje y mantenimiento)
========================================================================= */
function maintenanceStatus(unit){
  if(!unit.fechaUltimoMantenimiento) return {cls:"grey", label:"Sin registro"};
  const days = Math.floor((Date.now() - new Date(unit.fechaUltimoMantenimiento+"T00:00:00")) / 86400000);
  if(days < 0) return {cls:"grey", label:"Sin registro"};
  if(days > 90) return {cls:"red", label:"Mantenimiento vencido"};
  if(days > 60) return {cls:"amber", label:"Revisar pronto"};
  return {cls:"green", label:"Al día"};
}
function renderFlotilla(){
  const content = document.getElementById("content");
  const readonly = !canEdit();
  const units = DATA.fleet.units;
  const totalKm = units.reduce((s,u)=>s+(Number(u.kmActuales)||0),0);
  const avgKmSemana = units.length ? Math.round(units.reduce((s,u)=>s+(Number(u.kmPorSemana)||0),0)/units.length) : 0;
  const vencidas = units.filter(u=>maintenanceStatus(u).cls==="red").length;

  content.innerHTML = `
    <div class="budget-summary">
      <div class="budget-pill"><label>Unidades en flotilla</label><div class="amt">${units.length}</div></div>
      <div class="budget-pill"><label>Kilómetros totales</label><div class="amt">${totalKm.toLocaleString("es-MX")} km</div></div>
      <div class="budget-pill"><label>Promedio km / semana</label><div class="amt">${avgKmSemana.toLocaleString("es-MX")} km</div></div>
      <div class="budget-pill"><label>Mantenimiento vencido</label><div class="amt ${vencidas>0?'over':''}">${vencidas}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Unidad</th><th>Km actuales</th><th>Fecha último mantenimiento</th><th>Km por semana</th><th>Estado</th>
        </tr></thead>
        <tbody id="tbody-flotilla"></tbody>
      </table>
    </div>`;
  const tbody = document.getElementById("tbody-flotilla");
  units.forEach((u, idx)=>{
    const dis = readonly ? "disabled" : "";
    const st = maintenanceStatus(u);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="idcol">${idx+1}</td>
      <td><b>${esc(u.nombre)}</b></td>
      <td><input type="number" min="0" step="1" value="${Number(u.kmActuales)||0}" data-f="kmActuales" ${dis}></td>
      <td><input type="date" value="${esc(u.fechaUltimoMantenimiento)}" data-f="fechaUltimoMantenimiento" ${dis}></td>
      <td><input type="number" min="0" step="1" value="${Number(u.kmPorSemana)||0}" data-f="kmPorSemana" ${dis}></td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
    `;
    tbody.appendChild(tr);
    if(!readonly){
      tr.querySelectorAll("[data-f]").forEach(inp=>{
        inp.addEventListener("change", ()=>{
          u[inp.dataset.f] = inp.type==="number" ? (Number(inp.value)||0) : inp.value;
          saveData();
          renderFlotilla();
        });
      });
    }
  });
}

/* =========================================================================
   APROVISIONAMIENTOS — RESUMEN
========================================================================= */
function chronoLabel(anio, q){ return anio + "-" + q; }
function chronoSort(a, b){ return a.localeCompare(b); }
const CITY_COLOR_PALETTE = ["#2AA9D9","#3FA671","#E8A23D","#8B6FD1","#DD5C48","#4FB3BF","#B08D57"];
function cityColor(idx){ return CITY_COLOR_PALETTE[idx % CITY_COLOR_PALETTE.length]; }

function renderAprovResumen(){
  const content = document.getElementById("content");
  const aprov = DATA.aprovisionamientos || [];
  const constr = DATA.construccionesRed || [];

  const totalCapex = aprov.reduce((s,a)=>s+(Number(a.capex)||0),0);
  const totalKmUM = aprov.reduce((s,a)=>s+(Number(a.kmUM)||0),0);
  const totalKmRed = constr.reduce((s,c)=>s+(Number(c.distanciaKm)||0),0);
  const costoPromedio = aprov.length ? totalCapex/aprov.length : 0;

  const capexPorQ = {};
  aprov.forEach(a=>{ if(a.anio && a.q){ const k=chronoLabel(a.anio,a.q); capexPorQ[k]=(capexPorQ[k]||0)+(Number(a.capex)||0); } });
  const capexPorQRows = Object.keys(capexPorQ).sort(chronoSort).map(k=>({label:k, value:capexPorQ[k]}));
  const maxCapexQ = Math.max(1, ...capexPorQRows.map(r=>r.value));

  const capexAnual = {};
  aprov.forEach(a=>{ if(a.anio){ capexAnual[a.anio]=(capexAnual[a.anio]||0)+(Number(a.capex)||0); } });
  const capexAnualRows = Object.keys(capexAnual).sort().map(k=>({label:k, value:capexAnual[k]}));
  const maxCapexAnual = Math.max(1, ...capexAnualRows.map(r=>r.value));

  const kmPorQ = {};
  constr.forEach(c=>{ if(c.anio && c.q){ const k=chronoLabel(c.anio,c.q); kmPorQ[k]=(kmPorQ[k]||0)+(Number(c.distanciaKm)||0); } });
  const kmPorQRows = Object.keys(kmPorQ).sort(chronoSort).map(k=>({label:k, value:kmPorQ[k]}));
  const maxKmQ = Math.max(1, ...kmPorQRows.map(r=>r.value));

  const kmUMPorQ = {};
  aprov.forEach(a=>{ if(a.anio && a.q){ const k=chronoLabel(a.anio,a.q); kmUMPorQ[k]=(kmUMPorQ[k]||0)+(Number(a.kmUM)||0); } });
  const kmUMPorQRows = Object.keys(kmUMPorQ).sort(chronoSort).map(k=>({label:k, value:kmUMPorQ[k]}));
  const maxKmUMQ = Math.max(1, ...kmUMPorQRows.map(r=>r.value));

  const construccionesPorCiudad = {};
  constr.forEach(c=>{ const p=c.plaza||"Sin plaza"; construccionesPorCiudad[p]=(construccionesPorCiudad[p]||0)+1; });
  const ciudadesConstr = Object.keys(construccionesPorCiudad).sort((a,b)=>construccionesPorCiudad[b]-construccionesPorCiudad[a]);
  const donutConstrCiudad = buildDonut(ciudadesConstr.map((c,i)=>({label:c, value:construccionesPorCiudad[c], color:cityColor(i)})), "ciudadConstr");

  const inversionPorCiudad = {};
  aprov.forEach(a=>{ const p=a.plaza||"Sin plaza"; inversionPorCiudad[p]=(inversionPorCiudad[p]||0)+(Number(a.capex)||0); });
  const ciudadesInv = Object.keys(inversionPorCiudad).sort((a,b)=>inversionPorCiudad[b]-inversionPorCiudad[a]);
  const maxInversion = Math.max(1, ...ciudadesInv.map(c=>inversionPorCiudad[c]));

  const kmUMPorCiudad = {};
  aprov.forEach(a=>{ const p=a.plaza||"Sin plaza"; kmUMPorCiudad[p]=(kmUMPorCiudad[p]||0)+(Number(a.kmUM)||0); });
  const ciudadesKmUM = Object.keys(kmUMPorCiudad).sort((a,b)=>kmUMPorCiudad[b]-kmUMPorCiudad[a]);
  const maxKmUMCiudad = Math.max(1, ...ciudadesKmUM.map(c=>kmUMPorCiudad[c]));

  const porPlaza = {};
  aprov.forEach(a=>{
    const p = a.plaza || "Sin plaza";
    if(!porPlaza[p]) porPlaza[p] = {sum:0, count:0};
    porPlaza[p].sum += (Number(a.capex)||0);
    porPlaza[p].count++;
  });
  const plazasOrdenadas = Object.keys(porPlaza).sort((a,b)=>porPlaza[b].sum-porPlaza[a].sum);

  const estadoCounts = {};
  ESTADOS_APROV.forEach(e=>estadoCounts[e]=0);
  aprov.forEach(a=>{ const e=a.estado||"Pendiente"; estadoCounts[e]=(estadoCounts[e]||0)+1; });

  content.innerHTML = `
    <div class="budget-summary">
      <div class="budget-pill"><label>CAPEX total</label><div class="amt">${fmtMoney(totalCapex)}</div></div>
      <div class="budget-pill"><label>Km última milla</label><div class="amt">${totalKmUM.toLocaleString("es-MX",{maximumFractionDigits:1})} km</div></div>
      <div class="budget-pill"><label>Km construidos (red)</label><div class="amt">${totalKmRed.toLocaleString("es-MX",{maximumFractionDigits:1})} km</div></div>
      <div class="budget-pill"><label>Aprovisionamientos</label><div class="amt">${aprov.length}</div></div>
      <div class="budget-pill"><label>Costo promedio / cliente</label><div class="amt">${fmtMoney(costoPromedio)}</div></div>
    </div>

    <div class="card" style="margin-bottom:14px;">
      <p class="summary-title">Aprovisionamientos por estado</p>
      <div class="budget-summary" style="margin-bottom:0;">
        ${ESTADOS_APROV.map(e=>`<div class="budget-pill drill" data-drill-type="estado" data-drill-key="${esc(e)}"><label>${esc(e)}</label><div class="amt">${estadoCounts[e]||0}</div></div>`).join("")}
      </div>
    </div>

    <div class="footer-note" style="margin-bottom:10px;">Da clic en cualquier barra, segmento, ciudad o estado para ver el detalle y descargarlo en Excel.</div>

    <div class="grid-summary">
      <div class="card">
        <p class="summary-title">CAPEX por trimestre</p>
        ${capexPorQRows.map(r=>`
          <div class="bar-row drill" data-drill-type="capexQ" data-drill-key="${esc(r.label)}">
            <div class="label wide">${esc(r.label)}</div>
            <div class="track"><div class="fill" style="width:${(r.value/maxCapexQ)*100}%; background:var(--accent)"></div></div>
            <div class="val" style="width:auto; white-space:nowrap;">${fmtMoney(r.value)}</div>
          </div>`).join("") || `<div class="footer-note">Sin datos.</div>`}
      </div>
      <div class="card">
        <p class="summary-title">CAPEX anual</p>
        ${capexAnualRows.map(r=>`
          <div class="bar-row drill" data-drill-type="capexAnual" data-drill-key="${esc(r.label)}">
            <div class="label wide">${esc(r.label)}</div>
            <div class="track"><div class="fill" style="width:${(r.value/maxCapexAnual)*100}%; background:var(--navy-3)"></div></div>
            <div class="val" style="width:auto; white-space:nowrap;">${fmtMoney(r.value)}</div>
          </div>`).join("") || `<div class="footer-note">Sin datos.</div>`}
      </div>
    </div>

    <div class="grid-summary">
      <div class="card">
        <p class="summary-title">Kilómetros construidos por trimestre</p>
        ${kmPorQRows.map(r=>`
          <div class="bar-row drill" data-drill-type="kmQ" data-drill-key="${esc(r.label)}">
            <div class="label wide">${esc(r.label)}</div>
            <div class="track"><div class="fill" style="width:${(r.value/maxKmQ)*100}%; background:var(--green)"></div></div>
            <div class="val" style="width:auto; white-space:nowrap;">${r.value.toLocaleString("es-MX",{maximumFractionDigits:1})} km</div>
          </div>`).join("") || `<div class="footer-note">Sin datos.</div>`}
      </div>
      <div class="card">
        <p class="summary-title">Kilómetros de última milla por trimestre</p>
        ${kmUMPorQRows.map(r=>`
          <div class="bar-row drill" data-drill-type="kmUMQ" data-drill-key="${esc(r.label)}">
            <div class="label wide">${esc(r.label)}</div>
            <div class="track"><div class="fill" style="width:${(r.value/maxKmUMQ)*100}%; background:var(--accent)"></div></div>
            <div class="val" style="width:auto; white-space:nowrap;">${r.value.toLocaleString("es-MX",{maximumFractionDigits:1})} km</div>
          </div>`).join("") || `<div class="footer-note">Sin datos.</div>`}
      </div>
    </div>

    <div class="grid-summary">
      <div class="card">
        <p class="summary-title">Construcciones por ciudad</p>
        ${ciudadesConstr.length ? donutConstrCiudad : `<div class="footer-note">Sin datos.</div>`}
      </div>
      <div class="card">
        <p class="summary-title">Inversión (CAPEX) por ciudad</p>
        ${ciudadesInv.map((c,i)=>`
          <div class="bar-row drill" data-drill-type="ciudadInversion" data-drill-key="${esc(c)}">
            <div class="label wide">${esc(c)}</div>
            <div class="track"><div class="fill" style="width:${(inversionPorCiudad[c]/maxInversion)*100}%; background:${cityColor(i)}"></div></div>
            <div class="val" style="width:auto; white-space:nowrap;">${fmtMoney(inversionPorCiudad[c])}</div>
          </div>`).join("") || `<div class="footer-note">Sin datos.</div>`}
      </div>
    </div>

    <div class="grid-summary">
      <div class="card">
        <p class="summary-title">Km de última milla por ciudad</p>
        ${ciudadesKmUM.map((c,i)=>`
          <div class="bar-row drill" data-drill-type="ciudadKmUM" data-drill-key="${esc(c)}">
            <div class="label wide">${esc(c)}</div>
            <div class="track"><div class="fill" style="width:${(kmUMPorCiudad[c]/maxKmUMCiudad)*100}%; background:${cityColor(i)}"></div></div>
            <div class="val" style="width:auto; white-space:nowrap;">${kmUMPorCiudad[c].toLocaleString("es-MX",{maximumFractionDigits:1})} km</div>
          </div>`).join("") || `<div class="footer-note">Sin datos.</div>`}
      </div>
      <div class="card">
        <p class="summary-title">Costo promedio por cliente y ciudad</p>
        <div class="table-wrap" style="box-shadow:none; margin-bottom:0;">
          <table>
            <thead><tr><th>Ciudad</th><th>Aprov.</th><th>CAPEX total</th><th>Promedio</th></tr></thead>
            <tbody>
              ${plazasOrdenadas.map(p=>{
                const d = porPlaza[p];
                return `<tr class="drill" style="cursor:pointer;" data-drill-type="ciudadInversion" data-drill-key="${esc(p)}"><td><b>${esc(p)}</b></td><td class="mono">${d.count}</td><td class="mono">${fmtMoney(d.sum)}</td><td class="mono">${fmtMoney(d.count?d.sum/d.count:0)}</td></tr>`;
              }).join("") || `<tr><td colspan="4" style="text-align:center; color:var(--muted); padding:20px;">Sin datos.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  content.querySelectorAll("[data-drill-type]").forEach(el=>{
    el.addEventListener("click", ()=>{
      handleAprovDrillClick(el.dataset.drillType, el.dataset.drillKey);
    });
  });
}

const COLS_APROV_DRILL = [
  {key:"titulo", label:"Título"},
  {key:"plaza", label:"Plaza"},
  {key:"estado", label:"Estado"},
  {key:"q", label:"Q"},

function handleAprovDrillClick(type, key){
  const aprov = DATA.aprovisionamientos || [];
  const constr = DATA.construccionesRed || [];
  let rows = [], cols = COLS_APROV_DRILL, title = "", prefix = "detalle";

  if(type === "capexQ"){
    rows = aprov.filter(a=>chronoLabel(a.anio,a.q)===key);
    title = `Aprovisionamientos que generaron el CAPEX de ${key}`;
    prefix = `capex-${key}`;
  } else if(type === "capexAnual"){
    rows = aprov.filter(a=>String(a.anio)===String(key));
    title = `Aprovisionamientos que generaron el CAPEX de ${key}`;
    prefix = `capex-anual-${key}`;
  } else if(type === "kmQ"){
    rows = constr.filter(c=>chronoLabel(c.anio,c.q)===key);
    cols = COLS_CONSTR_DRILL;
    title = `Construcciones que generaron los km de ${key}`;
    prefix = `km-red-${key}`;
  } else if(type === "kmUMQ"){
    rows = aprov.filter(a=>chronoLabel(a.anio,a.q)===key);
    title = `Aprovisionamientos con km de última milla en ${key}`;
    prefix = `km-um-${key}`;
  } else if(type === "ciudadConstr"){
    rows = constr.filter(c=>(c.plaza||"Sin plaza")===key);
    cols = COLS_CONSTR_DRILL;
    title = `Construcciones en ${key}`;
    prefix = `construcciones-${key}`;
  } else if(type === "ciudadInversion"){
    rows = aprov.filter(a=>(a.plaza||"Sin plaza")===key);
    title = `Inversión (CAPEX) en ${key}`;
    prefix = `inversion-${key}`;
  } else if(type === "ciudadKmUM"){
    rows = aprov.filter(a=>(a.plaza||"Sin plaza")===key);
    title = `Km de última milla en ${key}`;
    prefix = `km-um-ciudad-${key}`;
  } else if(type === "estado"){
    rows = aprov.filter(a=>(a.estado||"Pendiente")===key);
    title = `Aprovisionamientos en estado "${key}"`;
    prefix = `estado-${key}`;
  }

  openDrilldownModal(title, rows, cols, prefix);
}

    kmUM:0, capex:0, cajas3M:0, cajasH60:0, drop:"", fo6:0, fo12:0, fo24:0, fo48:0, fo96:0
  });

let APROV_SEARCH = "";
function normalizeSearch(s){
  return (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
}
function matchesAprovSearch(titulo, query){
  const t = normalizeSearch(titulo);
  const words = normalizeSearch(query).trim().split(/\s+/).filter(Boolean);
  if(words.length === 0) return true;
  return words.every(w => t.includes(w));
}

  const content = document.getElementById("content");
  const editable = canEdit();

  content.innerHTML = `
    <div class="section-header" style="margin-bottom:12px; align-items:center;">
      <input type="text" id="aprov-search" placeholder="Buscar por título…" value="${esc(APROV_SEARCH)}"
        style="flex:1; min-width:220px; max-width:380px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13px;">
      <div class="footer-note" id="aprov-count" style="margin:0;"></div>
    </div>
    <div class="table-wrap tall">
      <table>
        <thead><tr>
          <th>No</th><th style="min-width:240px;">Título</th><th>Estado</th><th>Q</th><th>Año</th><th>Plaza</th><th>Mb</th><th>Km UM</th><th>CAPEX</th><th></th>
        </tr></thead>
        <tbody id="tbody-aprov"></tbody>
      </table>
    </div>
  `;

  function renderRows(){
    const fullList = DATA.aprovisionamientos || [];
    const list = fullList.filter(a => matchesAprovSearch(a.titulo, APROV_SEARCH));
    document.getElementById("aprov-count").textContent =
      `${list.length} de ${fullList.length} aprovisionamiento(s)` + (APROV_SEARCH.trim() ? ` · filtrado por "${APROV_SEARCH.trim()}"` : "");

    const tbody = document.getElementById("tbody-aprov");
    tbody.innerHTML = "";
    if(list.length === 0){
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:var(--muted); padding:24px;">Sin resultados.</td></tr>`;
      return;
    }
    const dis = editable ? "" : "disabled";
    list.forEach(a=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="idcol">${a.no||""}</td>
        <td><input type="text" value="${esc(a.titulo)}" data-f="titulo" ${dis}></td>
        <td><select class="status-select st-${String(a.estado).replace(/\s/g,'')}" data-f="estado" ${dis}>${opts(ESTADOS_APROV, a.estado)}</select></td>
        <td><select data-f="q" ${dis}>${opts(QS_OPTS, a.q)}</select></td>
        <td><input type="number" value="${a.anio||0}" data-f="anio" ${dis} style="width:66px;"></td>
        <td><select data-f="plaza" ${dis}>${opts(PLAZAS, a.plaza)}</select></td>
        <td><input type="number" value="${a.mb||0}" data-f="mb" ${dis} style="width:66px;"></td>
        <td><input type="number" step="0.01" value="${a.kmUM||0}" data-f="kmUM" ${dis} style="width:66px;"></td>
        <td><input type="number" value="${a.capex||0}" data-f="capex" ${dis} style="width:90px;"></td>
        <td style="white-space:nowrap;">
          <button class="link-btn" data-details="1">Detalles</button>
          ${editable ? `<button class="link-btn" style="color:var(--red);" data-del="1">Eliminar</button>` : ""}
        </td>
      `;
      tbody.appendChild(tr);

      if(editable){
        tr.querySelectorAll("[data-f]").forEach(inp=>{
          inp.addEventListener("change", ()=>{
            const f = inp.dataset.f;
            if(["anio","mb","kmUM","capex"].includes(f)){
              a[f] = Number(inp.value)||0;
            } else {
              a[f] = inp.value;
            }
            if(f === "estado"){
              inp.className = "status-select st-" + String(a.estado).replace(/\s/g,"");
            }
            saveData();
            if(f === "titulo") renderRows();
          });
        });
      }
      tr.querySelector("[data-details]").addEventListener("click", ()=>openAprovModal(a));
      const delBtn = tr.querySelector("[data-del]");
      if(delBtn){
        delBtn.addEventListener("click", ()=>{
          if(!confirm(`¿Eliminar "${a.titulo}"?`)) return;
          DATA.aprovisionamientos = DATA.aprovisionamientos.filter(x=>x.id!==a.id);
          saveData();
          renderRows();
        });
      }
    });
  }

  renderRows();

  document.getElementById("aprov-search").addEventListener("input", (e)=>{
    APROV_SEARCH = e.target.value;
    renderRows();
  });
}

function mesDesdeFecha(fecha){
  if(!fecha) return "";

  return MESES_NOMBRES[d.getMonth()];

/* =========================================================================
   RED FIBRA ÓPTICA — MAPA (Leaflet + KMZ/KML + coordenadas + distancia)
========================================================================= */
let redFibraMap = null;
let kmzLayerGroup = null;
let coordMarker = null;
let routeLayer = null;
let kmlVertices = []; // [[lat,lng], ...] de todo lo cargado, para buscar el punto más cercano
const KML_TEXT_MAX_CHARS = 350000; // límite de resguardo para no saturar el documento compartido de Firestore

function coordsTextToLatLngs(coordText){
  return coordText.trim().split(/\s+/).map(pair=>{
    const parts = pair.split(",");
    const lon = parseFloat(parts[0]);
    const lat = parseFloat(parts[1]);
    return [lat, lon];
  }).filter(p=>!isNaN(p[0]) && !isNaN(p[1]));
}

function parseKmlToLayers(kmlText){
  const parser = new DOMParser();
  const xml = parser.parseFromString(kmlText, "text/xml");
  const layers = [];
  kmlVertices = [];

  function processGeometry(geomEl, popupText){
    const tag = geomEl.tagName;
    if(tag === "Point"){
      const coordEl = geomEl.querySelector("coordinates");
      if(!coordEl) return;
      const latlngs = coordsTextToLatLngs(coordEl.textContent);
      if(latlngs[0]){
        const m = L.marker(latlngs[0]);
        if(popupText) m.bindPopup(popupText);
        layers.push(m);
        kmlVertices.push(latlngs[0]);
      }
    } else if(tag === "LineString"){
      const coordEl = geomEl.querySelector("coordinates");
      if(!coordEl) return;
      const latlngs = coordsTextToLatLngs(coordEl.textContent);
      if(latlngs.length){
        const pl = L.polyline(latlngs, {color:"#2AA9D9", weight:3});
        if(popupText) pl.bindPopup(popupText);
        layers.push(pl);
        kmlVertices.push(...latlngs);
      }
    } else if(tag === "Polygon"){
      const outer = geomEl.querySelector("outerBoundaryIs coordinates");
      if(!outer) return;
      const latlngs = coordsTextToLatLngs(outer.textContent);
      if(latlngs.length){
        const poly = L.polygon(latlngs, {color:"#3FA671", weight:2, fillOpacity:0.15});
        if(popupText) poly.bindPopup(popupText);
        layers.push(poly);
        kmlVertices.push(...latlngs);
      }
    } else if(tag === "MultiGeometry"){
      Array.from(geomEl.children).forEach(child=>processGeometry(child, popupText));
    }
  }

  const placemarks = xml.querySelectorAll("Placemark");
  placemarks.forEach(pm=>{
    const nameEl = pm.querySelector("name");
    const name = nameEl ? nameEl.textContent.trim() : "";
    const popupText = name ? `<b>${esc(name)}</b>` : "";
    ["Point","LineString","Polygon","MultiGeometry"].forEach(tag=>{
      const geomEl = pm.querySelector(":scope > "+tag);
      if(geomEl) processGeometry(geomEl, popupText);
    });
  });

  return layers;
}

function loadKmlIntoMap(kmlText, filename, statusSuffix){
  const statusEl = document.getElementById("kmz-status");
  try{
    const layers = parseKmlToLayers(kmlText);
    kmzLayerGroup.clearLayers();
    if(layers.length === 0){
      if(statusEl) statusEl.textContent = `"${filename}" no contiene elementos reconocibles (puntos, líneas o polígonos).`;
      return false;
    }
    layers.forEach(l=>kmzLayerGroup.addLayer(l));
    const group = L.featureGroup(layers);
    redFibraMap.fitBounds(group.getBounds(), {padding:[30,30]});
    if(statusEl) statusEl.textContent = `"${esc(filename)}" — ${layers.length} elemento(s).${statusSuffix ? " " + statusSuffix : ""}`;
    const clearBtn = document.getElementById("kmz-clear");
    if(clearBtn && canEdit()) clearBtn.style.display = "inline-flex";
    return true;
  }catch(err){
    console.error("Error interpretando KML:", err);
    if(statusEl) statusEl.textContent = "No se pudo leer el archivo. Verifica que sea un KMZ o KML válido.";
    return false;
  }
}

async function handleKmzUpload(e){
  if(!canEdit()) return;
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById("kmz-status");
  statusEl.textContent = "Cargando…";
  try{
    let kmlText;
    if(file.name.toLowerCase().endsWith(".kmz")){
      const zip = await JSZip.loadAsync(file);
      let kmlEntry = null;
      zip.forEach((relPath, entry)=>{ if(!kmlEntry && relPath.toLowerCase().endsWith(".kml")) kmlEntry = entry; });
      if(!kmlEntry) throw new Error("El archivo KMZ no contiene un .kml.");
      kmlText = await kmlEntry.async("text");
    } else if(file.name.toLowerCase().endsWith(".kml")){
      kmlText = await file.text();
    } else {
      statusEl.textContent = "Formato no soportado. Sube un archivo .kmz o .kml.";
      return;
    }

    if(kmlText.length > KML_TEXT_MAX_CHARS){
      statusEl.textContent = `El archivo es demasiado pesado para compartirlo con el equipo (${Math.round(kmlText.length/1024)} KB). Intenta con una versión más ligera del KMZ.`;
      return;
    }

    const ok = loadKmlIntoMap(kmlText, file.name);
    if(ok){
      DATA.redFibra = {
        filename: file.name,
        kmlText: kmlText,
        uploadedBy: CURRENT_USER.nombre || CURRENT_USER.username,
        uploadedAt: new Date().toISOString()
      };
      saveData();
    }
  }catch(err){
    console.error("Error leyendo KMZ/KML:", err);
    statusEl.textContent = "No se pudo leer el archivo. Verifica que sea un KMZ o KML válido.";
  }
}

/* ---------- coordenada (cuadro único) ---------- */
function parseCoordText(text){
  text = (text||"").trim();
  if(!text) return null;
  let parts = text.includes(",") ? text.split(",") : text.split(/\s+/);
  if(parts.length < 2) return null;
  const lat = parseFloat(parts[0].trim().replace(",", "."));
  const lng = parseFloat(parts[1].trim().replace(",", "."));
  if(isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
  return {lat, lng};
}

/* ---------- distancia aproximada (ruta por calles, límite 20 km) ---------- */
function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function findNearestKmlVertex(lat, lng){
  if(!kmlVertices.length) return null;
  let best = null, bestDist = Infinity;
  kmlVertices.forEach(p=>{
    const d = haversineKm(lat, lng, p[0], p[1]);
    if(d < bestDist){ bestDist = d; best = p; }
  });
  return {point: best, straightKm: bestDist};
}

async function calcularDistanciaRuta(){
  const coord = parseCoordText(document.getElementById("coord-single").value);
  if(!coord){ alert("Primero escribe y muestra una coordenada válida."); return; }
  const nearest = findNearestKmlVertex(coord.lat, coord.lng);
  if(!nearest){
    showDistanciaResultado(`<div class="footer-note">No hay una red (KMZ) cargada para calcular distancia.</div>`, "warn");
    return;
  }

  if(nearest.straightKm > 20){
    showDistanciaResultado(
      `<div class="amt" style="color:var(--red); font-size:16px;">Debe revisarse factibilidad</div>
       <div class="footer-note">El punto más cercano de la red está a ${nearest.straightKm.toFixed(1)} km en línea recta — supera el límite de 20 km para este cálculo.</div>`,
      "danger"
    );
    return;
  }

  showDistanciaResultado(`<div class="footer-note">Calculando ruta por calles…</div>`, "loading");

  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${nearest.point[1]},${nearest.point[0]};${coord.lng},${coord.lat}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.code === "Ok" && data.routes && data.routes[0]){
      const distKm = data.routes[0].distance / 1000;
      showDistanciaResultado(
        `<div class="amt" style="font-size:22px;">${distKm.toFixed(2)} km</div>
         <div class="footer-note">Ruta aproximada por calles y caminos desde el punto más cercano de la red hasta la coordenada indicada.</div>`,
        "ok", distKm
      );
      if(routeLayer){ redFibraMap.removeLayer(routeLayer); }
      const coords = data.routes[0].geometry.coordinates.map(c=>[c[1], c[0]]);
      routeLayer = L.polyline(coords, {color:"#E8A23D", weight:4, dashArray:"6 6"}).addTo(redFibraMap);
    } else {
      showDistanciaResultado(
        `<div class="amt" style="font-size:18px;">${nearest.straightKm.toFixed(2)} km (línea recta)</div>
         <div class="footer-note">No se encontró una ruta por calles entre esos puntos; se muestra la distancia en línea recta.</div>`,
        "warn", nearest.straightKm
      );
    }
  }catch(err){
    console.error("Error calculando ruta:", err);
    showDistanciaResultado(
      `<div class="amt" style="font-size:18px;">${nearest.straightKm.toFixed(2)} km (línea recta)</div>
       <div class="footer-note">No se pudo consultar el servicio de rutas en este momento; se muestra la distancia en línea recta.</div>`,
      "warn", nearest.straightKm
    );
  }
}

function costoPorMetroUltimaMilla(){
  const mats = DATA.cotizador.materiales;
  const t = DATA.cotizador.tarifas;
  const subtotalUSD = mats.reduce((s,m)=>s+(Number(m.cantidad)||0)*(Number(m.precioUnitario)||0), 0);
  return (subtotalUSD * t.tipoCambio) / 1000;
}

function computeCotizacionTotal(){
  const t = DATA.cotizador.tarifas;
  const q = DATA.cotizacionActual;
  const costoPorMetro = costoPorMetroUltimaMilla();
  let total = 0;
  const detalle = COTIZACION_LINEAS.map(l=>{
    const costo = l.calc(q, t, costoPorMetro);
    total += costo;
    return {label:l.label, costo};
  });
  return {detalle, total, costoPorMetro};
}

async function downloadCotizacionPDF(){
  const wrap = document.getElementById("cotizacion-table-wrap");
  if(!wrap){ alert("Abre la pestaña Cotizador antes de descargar."); return; }
  try{
    const canvas = await html2canvas(wrap, {scale:2, backgroundColor:"#ffffff"});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const margin = 12;
    const pageWidth = 210;
    const usableWidth = pageWidth - margin*2;
    const imgWidth = usableWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;

    pdf.setFontSize(14);
    pdf.text("Cotización rápida — Instalación de Fibra Óptica", margin, margin+4);
    pdf.setFontSize(8);
    pdf.setTextColor(120);
    pdf.text(`Generado el ${new Date().toLocaleDateString("es-MX")} por ${CURRENT_USER.nombre||CURRENT_USER.username}`, margin, margin+9);

    const imgData = canvas.toDataURL("image/png");
    pdf.addImage(imgData, "PNG", margin, margin+14, imgWidth, imgHeight);

    let y = margin + 14 + imgHeight + 10;
    if(y > 260){ pdf.addPage(); y = margin; }
    pdf.setFillColor(251, 235, 211);
    pdf.rect(margin, y, usableWidth, 18, "F");
    pdf.setFontSize(9);
    pdf.setTextColor(156, 106, 22);
    pdf.text("Elemento consultivo:", margin+3, y+6);
    pdf.setFontSize(8);
    const nota = "Toda factibilidad administrativa arrojada por este cotizador debe ser revisada y validada por el área de Planta Externa. Este resultado es una referencia rápida, no una cotización final.";
    const lineas = pdf.splitTextToSize(nota, usableWidth-6);
    pdf.text(lineas, margin+3, y+11);

    pdf.save(`cotizacion-fibra-optica-${new Date().toISOString().slice(0,10)}.pdf`);
  }catch(err){
    console.error("Error generando PDF de cotización:", err);
    alert("No se pudo generar el PDF. Intenta de nuevo.");
  }
}

function calcCumplimientoCx(s){
  if(s.fechaCierre){
    if(!s.fechaCompromiso) return "";
    return s.fechaCierre <= s.fechaCompromiso ? "En tiempo" : "Fuera de tiempo";
  }
  if(s.estatus === "ABIERTO" && s.fechaCompromiso){
    const hoy = new Date().toISOString().slice(0,10);
    return hoy > s.fechaCompromiso ? "Fuera de tiempo" : "";
  }
  return "";
}
function calcDiasAbiertosCx(s){
  if(!s.fechaSolicitud) return 0;
  const start = new Date(s.fechaSolicitud+"T00:00:00");
  const end = s.fechaCierre ? new Date(s.fechaCierre+"T00:00:00") : new Date();
  return Math.max(0, Math.round((end-start)/86400000));
}

const COLS_CX_FULL = [
  {key:"folio", label:"Folio"},
  {key:"idExterno", label:"ID"},
  {key:"fechaSolicitud", label:"Fecha de solicitud"},
  {key:"cliente", label:"Cliente"},
  {key:"tipo", label:"Tipo"},
  {key:"descripcion", label:"Descripción"},
  {key:"responsable", label:"Responsable"},
  {key:"prioridad", label:"Prioridad"},
  {key:"estatus", label:"Estatus"},
  {key:"fechaCompromiso", label:"Fecha compromiso"},
  {key:"fechaCierre", label:"Fecha cierre"},
  {key:"urlDetalle", label:"URL Detalle"}
];

function cxFilteredBase(){
  const all = DATA.crmSolicitudes || [];
  return all.filter(s=>{
    if(CX_FILTERS.mes && mesDesdeFecha(s.fechaSolicitud) !== CX_FILTERS.mes) return false;
    if(CX_FILTERS.cliente && s.cliente !== CX_FILTERS.cliente) return false;
    if(CX_FILTERS.tipo && s.tipo !== CX_FILTERS.tipo) return false;
    return true;
  });
}

function handleCxDrillClick(type, key){
  const base = cxFilteredBase();
  let rows = [], title = "", prefix = "atencion-cliente";

  if(type === "cx-total"){
    rows = base;
    title = "Todas las solicitudes (filtro actual)";
    prefix = "atencion-cliente-total";
  } else if(type === "cx-mes"){
    rows = base.filter(s=>mesDesdeFecha(s.fechaSolicitud)===key);
    title = `Solicitudes de ${key}`;
    prefix = `atencion-cliente-${key}`;
  } else if(type === "cx-tipo"){
    rows = base.filter(s=>s.tipo===key);
    title = `Solicitudes de tipo "${key}"`;
    prefix = `atencion-cliente-tipo-${key}`;
  } else if(type === "cx-prioridad"){
    rows = base.filter(s=>s.prioridad===key);
    title = `Solicitudes con prioridad "${key}"`;
    prefix = `atencion-cliente-prioridad-${key}`;
  } else if(type === "cx-estatus"){
    rows = base.filter(s=>s.estatus===key);
    title = `Solicitudes en estatus "${key}"`;
    prefix = `atencion-cliente-estatus-${key}`;
  } else if(type === "cx-cumplimiento"){
    if(key === "Sin definir"){
      rows = base.filter(s=>!calcCumplimientoCx(s));
    } else {
      rows = base.filter(s=>calcCumplimientoCx(s)===key);
    }
    title = `Solicitudes — ${key}`;
    prefix = `atencion-cliente-cumplimiento-${key}`;
  }

  openDrilldownModal(title, rows, COLS_CX_FULL, prefix);
}

function downloadCxDB(){
  const rows = (DATA.crmSolicitudes || []).slice().sort((a,b)=>(b.fechaSolicitud||"").localeCompare(a.fechaSolicitud||""));
  const wsData = rows.map(r=>{
    const obj = {};
    COLS_CX_FULL.forEach(c=>{ obj[c.label] = r[c.key] ?? ""; });
    obj["Días abiertos"] = calcDiasAbiertosCx(r);
    obj["Cumplimiento"] = calcCumplimientoCx(r);
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Atencion a Cliente");
  XLSX.writeFile(wb, `atencion-a-cliente-${new Date().toISOString().slice(0,10)}.xlsx`);
}

  `;

  const overlay = openModal(html, "wide");
  overlay.querySelector("#cx-cancel").addEventListener("click", closeModal);
  overlay.querySelector("#cx-submit").addEventListener("click", ()=>{
    const cliente = overlay.querySelector("#cx-cliente").value.trim();
    const fechaSolicitud = overlay.querySelector("#cx-fecha").value;
    if(!cliente || !fechaSolicitud){ alert("El cliente y la fecha de solicitud son obligatorios."); return; }
    const rec = {
      cliente,
      fechaSolicitud,
      descripcion: overlay.querySelector("#cx-desc").value.trim(),
      idExterno: overlay.querySelector("#cx-id").value.trim(),
      tipo: overlay.querySelector("#cx-tipo").value,
      prioridad: overlay.querySelector("#cx-prioridad").value,
      estatus: overlay.querySelector("#cx-estatus").value,
      responsable: overlay.querySelector("#cx-resp").value.trim(),
      fechaCompromiso: overlay.querySelector("#cx-fcompromiso").value,
      fechaCierre: overlay.querySelector("#cx-fcierre").value,
      urlDetalle: overlay.querySelector("#cx-url").value.trim()
    };
    if(isEdit){
      Object.assign(existing, rec);
    } else {
      const maxNum = (DATA.crmSolicitudes||[]).reduce((m,x)=>{
        const n = parseInt((x.folio||"").replace(/\D/g,""),10);
        return isNaN(n) ? m : Math.max(m,n);
      }, 0);
      const folio = "FN-" + String(maxNum+1).padStart(4,"0");
      DATA.crmSolicitudes.push(Object.assign({id:newId(), folio}, rec));
    }
    saveData();
    closeModal();
    renderCxDB();
  });
}

/* =========================================================================
   INIT
========================================================================= */
document.getElementById("login-submit").addEventListener("click", doLogin);
document.getElementById("login-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
document.getElementById("login-user").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
document.getElementById("btn-logout").addEventListener("click", logout);

/* Corrección: al presionar Enter en cualquier campo de captura del panel, se confirma
   el valor igual que si se cambiara de campo — así el dato queda guardado siempre,
   sin depender de que el usuario haga clic fuera del campo. */
document.addEventListener("keydown", (e)=>{
  if(e.key !== "Enter") return;
  const t = e.target;
  if(!t || !["INPUT","SELECT"].includes(t.tagName)) return;
  if(t.id === "login-user" || t.id === "login-pass") return; // ya tienen su propio manejo de Enter
  if(["checkbox","radio","file"].includes(t.type)) return;
  e.preventDefault();
  t.blur();
});

window.addEventListener("beforeunload", ()=>{
  if(CURRENT_USER && DATA && DATA.connectionLog && DATA.connectionLog[CURRENT_USER.username]){
    DATA.connectionLog[CURRENT_USER.username].sessionLastSeen = new Date().toISOString();
    saveData();
  }
});

function doLogin(){
  if(!dataReady) return;
  const u = document.getElementById("login-user").value;
  const p = document.getElementById("login-pass").value;
  if(tryLogin(u,p)){
    document.getElementById("login-error").style.display = "none";
    showApp();
  } else {
    document.getElementById("login-error").textContent = "Usuario o contraseña incorrectos.";
    document.getElementById("login-error").style.display = "block";
  }
}

document.getElementById("login-screen").style.display = "flex";
if(firebaseReady){
  initRealtimeSync();
} else {
  const errBox = document.getElementById("login-error");
  errBox.textContent = "No se pudo cargar la conexión con la base de datos (Firebase). Revisa tu conexión a internet, desactiva bloqueadores de anuncios/privacidad para este sitio, o intenta desde otro navegador, y recarga la página.";
  errBox.style.display = "block";
  const loginBtn = document.getElementById("login-submit");
  loginBtn.disabled = true;
  loginBtn.textContent = "No disponible";
}
</script>
