<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Proyectos — Fibranet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --navy:#0A1B33;
  --navy-2:#122845;
  --navy-3:#1B3A63;
  --line:#DCE2EC;
  --text:#122036;
  --muted:#5C6B85;
  --accent:#2AA9D9;
  --accent-dim:#DCF1FA;
  --amber:#E8A23D;
  --amber-dim:#FBEBD3;
  --green:#3FA671;
  --green-dim:#DEF2E6;
  --red:#DD5C48;
  --red-dim:#FBE2DD;
  --grey-dim:#EEF0F4;
  --radius:10px;
  --shadow:0 1px 2px rgba(10,27,51,.06), 0 6px 20px rgba(10,27,51,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}

/* ---------- login ---------- */
#login-screen{
  position:fixed; inset:0; z-index:100;
  background:radial-gradient(1200px 600px at 20% -10%, #16345A, var(--navy) 60%);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.login-card{
  width:100%; max-width:360px; background:var(--surface); border-radius:14px;
  padding:34px 30px 28px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  text-align:center;
}
.login-logo-wrap{
  width:84px; height:84px; border-radius:20px; background:#fff;
  display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
  box-shadow:0 10px 28px rgba(10,27,51,.16), 0 0 0 1px var(--line);
}
.login-logo{width:100%; height:100%; object-fit:contain; padding:12px;}
.login-brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:21px; color:var(--navy); letter-spacing:.2px;}
.login-brand .accent-n{color:var(--accent);}
.login-sub{font-size:11.5px; color:var(--muted); margin:2px 0 22px;}
.login-field{text-align:left; margin-bottom:14px;}
.login-field label{display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
.login-field input{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
  font-family:inherit; font-size:13.5px; background:#FAFBFD;
}
.login-field input:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-dim);}
.login-error{
  font-size:12px; color:var(--red); background:var(--red-dim); border-radius:8px;
  padding:8px 10px; margin-bottom:14px; display:none;
}
.login-btn{
  width:100%; padding:11px; border:none; border-radius:8px; background:var(--navy);
  color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;
  transition:background .12s;
}
.login-btn:hover{background:var(--navy-3);}
.login-hint{font-size:10.5px; color:#9FB3D1; margin-top:18px; line-height:1.5;}

/* ---------- layout ---------- */
.app{display:none;}
.app.visible{display:flex; min-height:100vh;}

.sidebar{
  width:250px; flex:0 0 250px;
  background:linear-gradient(180deg,var(--navy),var(--navy-2) 70%);
  color:#EAF1FB;
  padding:22px 16px;
  position:relative;
  overflow:hidden;
}
.sidebar::after{
  content:"";
  position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,transparent,var(--accent) 40%,#8FE3FF 55%,var(--accent) 70%,transparent);
  background-size:220% 100%;
  animation:pulse 5s linear infinite;
}
@keyframes pulse{0%{background-position:0% 0;}100%{background-position:-220% 0;}}
@media (prefers-reduced-motion: reduce){ .sidebar::after{animation:none;} }

.brand-card{
  display:flex; align-items:center; gap:13px;
  background:linear-gradient(155deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;
  padding:14px 14px;
  margin-bottom:16px;
}
.brand-mark{
  width:52px;height:52px;border-radius:13px;
  background:#fff; flex:0 0 52px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.5) inset;
  overflow:hidden;
}
.brand-mark img{width:100%; height:100%; object-fit:contain; padding:6px;}
.brand-text{line-height:1.2;}
.brand-text b{display:block;font-size:17px;letter-spacing:.3px; color:#fff;}
.brand-text span{
  display:block;font-size:10px;color:var(--accent); font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; margin-top:3px;
}
.brand-sub{
  font-size:10.5px; color:#8FA5C8; padding:0 4px 16px; line-height:1.4; border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:8px;
}

.nav-group-label{
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:#7E93B8; margin:16px 10px 8px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:8px; cursor:pointer;
  color:#C8D6EC; font-size:13.5px; font-weight:500;
  margin-bottom:2px; transition:background .12s ease, color .12s ease;
  border:1px solid transparent;
}
.nav-item .dot{width:7px;height:7px;border-radius:50%; background:#4A5F82; flex:0 0 7px;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(42,169,217,.16); color:#fff; border-color:rgba(42,169,217,.35);}
.nav-item.active .dot{background:var(--accent); box-shadow:0 0 0 3px rgba(42,169,217,.25);}
.nav-item .pct{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8FA5C8;}
.nav-item .tag-done{margin-left:auto; font-size:9.5px; background:rgba(63,166,113,.22); color:#8FE3B8; padding:2px 6px; border-radius:5px; font-weight:700;}
.nav-item.big{
  font-size:14.5px; font-weight:600; padding:12px 12px;
}
.nav-item.big .dot{width:8px; height:8px;}

/* ---------- subtabs (dentro de "Proyectos") ---------- */
.subtabs{
  display:flex; align-items:center; gap:4px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); margin-bottom:22px; padding-bottom:0;
}
.subtab{
  padding:9px 15px; font-size:12.5px; font-weight:600; color:var(--muted);
  cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
  transition:color .12s, border-color .12s;
}
.subtab:hover{color:var(--navy);}
.subtab.active{color:var(--accent); border-bottom-color:var(--accent);}
.subtab-sep{
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:#B9C2D4; padding:9px 10px 9px 18px; white-space:nowrap;
  border-left:1px solid var(--line); margin-left:6px;
}

/* ---------- session indicator ---------- */
.session-indicator{
  font-size:11px; color:var(--muted); text-align:right;
}
.session-indicator b{color:var(--text); font-weight:600;}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,20,35,.55); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-card{
  background:var(--surface); border-radius:14px; padding:26px 26px 22px;
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.3);
}
.modal-card h3{margin:0 0 4px; font-size:17px; color:var(--navy);}
.modal-card .modal-desc{font-size:12px; color:var(--muted); margin-bottom:18px;}
.modal-field{margin-bottom:14px; text-align:left;}
.modal-field label{display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
.modal-field input, .modal-field select, .modal-field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  font-family:inherit; font-size:13px; background:#FAFBFD;
}
.modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus{
  outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-dim);
}
.modal-field textarea{resize:vertical;}
.modal-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}

/* ---------- info panel de proyecto ---------- */
.info-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:18px;
  box-shadow:var(--shadow);
}
.info-cell{background:var(--surface); padding:12px 14px;}
.info-cell label{display:block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:5px;}
.info-cell input, .info-cell select{
  width:100%; border:1px solid transparent; background:transparent; font-family:inherit;
  font-size:13px; font-weight:600; padding:3px 4px; border-radius:6px; color:var(--text);
}
.info-cell input:hover, .info-cell select:hover{background:var(--grey-dim);}
.info-cell input:focus, .info-cell select:focus{outline:none; background:#fff; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-dim);}
.info-cell input:disabled, .info-cell select:disabled{background:transparent; color:var(--text); opacity:1; -webkit-text-fill-color:var(--text);}
.info-cell.readonly-text{font-size:13px; font-weight:600; color:var(--text); padding-top:13px;}

/* ---------- presupuesto ---------- */
.budget-summary{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
.budget-pill{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 18px; flex:1; min-width:150px; box-shadow:var(--shadow);
}
.budget-pill label{display:block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:4px;}
.budget-pill .amt{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:18px; color:var(--navy);}
.budget-pill .amt.over{color:var(--red);}
.budget-pill .amt.under{color:var(--green);}
.tipo-Compra{background:var(--accent-dim); color:#0E6E93; font-weight:700; padding:3px 9px; border-radius:6px; font-size:11px;}
.tipo-Gasto{background:var(--amber-dim); color:#9C6A16; font-weight:700; padding:3px 9px; border-radius:6px; font-size:11px;}
.mini-budget{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.mini-budget .row{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px;}
.mini-budget .row b{color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:600;}
.mini-budget .track{height:6px; border-radius:999px; background:var(--grey-dim); overflow:hidden;}
.mini-budget .fill{height:100%; border-radius:999px;}

/* ---------- prefijo de moneda ---------- */
.money-input-wrap{position:relative;}
.money-input-wrap .currency-prefix{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  font-size:13px; color:var(--muted); font-weight:600; pointer-events:none;
}
.money-input-wrap input{padding-left:20px !important;}
.info-cell .money-input-wrap .currency-prefix{left:5px; font-size:13px;}
.info-cell .money-input-wrap input{padding-left:15px !important;}

.btn-del-row{
  border:1px solid var(--red-dim); background:var(--red-dim); color:var(--red);
  padding:5px 12px; border-radius:7px; font-size:11.5px; font-weight:700;
  cursor:pointer; font-family:inherit;
}
.btn-del-row:hover{background:var(--red); color:#fff; border-color:var(--red);}

.sidebar-user{
  position:absolute; bottom:0; left:0; right:0;
  padding:14px 16px 18px; border-top:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.12);
}
.sidebar-user .who{font-size:12.5px; font-weight:600; color:#EAF1FB;}
.sidebar-user .role{font-size:10.5px; color:#8FA5C8; margin-bottom:8px;}
.sidebar-user button{
  width:100%; padding:7px; border-radius:7px; border:1px solid rgba(255,255,255,.16);
  background:transparent; color:#C8D6EC; font-family:inherit; font-size:11.5px; cursor:pointer;
}
.sidebar-user button:hover{background:rgba(255,255,255,.08); color:#fff;}

.main{flex:1; min-width:0; padding:26px 34px 60px 26px; margin-left:250px; padding-left:34px;}
.topbar{
  display:flex; align-items:flex-end; justify-content:space-between;
  margin-bottom:22px; gap:16px; flex-wrap:wrap;
}
.topbar h1{font-size:22px; margin:0 0 4px; font-weight:700; color:var(--navy);}
.topbar .sub{color:var(--muted); font-size:12.5px;}
.topbar .actions{display:flex; gap:8px;}

.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600;
  cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px;
  transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--accent); background:var(--accent-dim);}
.btn-primary{background:var(--navy); color:#fff; border-color:var(--navy);}
.btn-primary:hover{background:var(--navy-3); border-color:var(--navy-3);}
.btn-danger{color:var(--red);}
.btn-danger:hover{background:var(--red-dim); border-color:var(--red);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--grey-dim);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn:disabled:hover{background:var(--surface); border-color:var(--line);}

.viewer-banner{
  background:var(--amber-dim); color:#9C6A16; border:1px solid #F0D4A0; border-radius:8px;
  padding:8px 14px; font-size:12px; font-weight:600; margin-bottom:18px; display:flex; align-items:center; gap:8px;
}

/* ---------- cards / dashboard ---------- */
.q3-badge{
  font-size:10px; font-weight:700; letter-spacing:.04em; padding:3px 9px; border-radius:999px;
  background:var(--accent-dim); color:#0E6E93; white-space:nowrap;
}
.grid-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px;}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow);
}
.card-proj{display:flex; flex-direction:column; gap:10px;}
.card-proj .row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.card-proj h3{margin:0; font-size:14.5px; color:var(--navy);}
.card-proj .meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
.card-proj .badges{display:flex; gap:6px; flex-direction:column; align-items:flex-end;}
.badge{
  font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.02em;
  white-space:nowrap;
}
.badge.green{background:var(--green-dim); color:var(--green);}
.badge.amber{background:var(--amber-dim); color:#9C6A16;}
.badge.red{background:var(--red-dim); color:var(--red);}
.badge.grey{background:var(--grey-dim); color:var(--muted);}

.progress-track{height:8px; border-radius:999px; background:var(--grey-dim); overflow:hidden;}
.progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),#7ED2EE);}
.pct-num{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:20px; color:var(--navy);}

.mini-stats{display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin-top:2px;}
.mini-stats b{color:var(--text); font-family:'IBM Plex Mono',monospace;}

.add-project-card{
  border:1.5px dashed var(--line); border-radius:var(--radius); background:transparent;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
  color:var(--muted); font-weight:600; font-size:12.5px; cursor:pointer; min-height:120px;
  transition:border-color .12s, color .12s, background .12s;
}
.add-project-card:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}
.add-project-card .plus{font-size:22px; line-height:1;}

.grid-summary{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:24px;}
.summary-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 12px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12.5px;}
.bar-row .label{width:96px; flex:0 0 96px; color:var(--muted);}
.bar-row .track{flex:1; height:10px; background:var(--grey-dim); border-radius:999px; overflow:hidden;}
.bar-row .fill{height:100%; border-radius:999px;}
.bar-row .val{width:26px; text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:600;}

.completed-link-card{
  background:var(--navy); color:#fff; border-radius:var(--radius); padding:16px 18px;
  display:flex; align-items:center; justify-content:space-between; cursor:pointer; margin-bottom:24px;
  box-shadow:var(--shadow);
}
.completed-link-card:hover{background:var(--navy-3);}
.completed-link-card .l1{font-size:12px; color:#9FB3D1; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px;}
.completed-link-card .l2{font-size:16px; font-weight:700;}
.completed-link-card .arrow{font-size:20px; color:var(--accent);}

/* ---------- tables ---------- */
.table-wrap{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow-x:auto; margin-bottom:18px;
}
table{border-collapse:collapse; width:100%; min-width:960px;}
thead th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  color:#fff; background:var(--navy-2); padding:10px 12px; font-weight:600; white-space:nowrap;
}
thead th:first-child{border-top-left-radius:var(--radius);}
thead th:last-child{border-top-right-radius:var(--radius);}
tbody td{padding:7px 12px; border-bottom:1px solid var(--line); font-size:12.5px; vertical-align:middle;}
tbody tr:nth-child(even){background:#FAFBFD;}
tbody tr:hover{background:var(--accent-dim);}
td.idcol{font-family:'IBM Plex Mono',monospace; color:var(--muted); width:28px;}
td input[type=text], td input[type=date], td input[type=password], td textarea, td select{
  width:100%; border:1px solid transparent; background:transparent; font-family:inherit;
  font-size:12.5px; padding:5px 6px; border-radius:6px; color:var(--text);
}
td input:hover, td select:hover, td textarea:hover{background:var(--grey-dim);}
td input:focus, td select:focus, td textarea:focus{
  outline:none; background:#fff; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-dim);
}
td input:disabled, td select:disabled, td textarea:disabled{
  background:transparent; color:var(--text); opacity:1; -webkit-text-fill-color:var(--text); cursor:default;
}
td textarea{resize:vertical; min-height:30px;}
select.status-select{font-weight:600; border-radius:6px; padding:5px 8px;}
.st-Pendiente{background:var(--grey-dim); color:#5C6B85;}
.st-EnProgreso{background:var(--amber-dim); color:#9C6A16;}
.st-Completada{background:var(--green-dim); color:var(--green);}
.st-Bloqueada{background:var(--red-dim); color:var(--red);}
.prio-Alta{color:var(--red); font-weight:700;}
.prio-Media{color:#9C6A16; font-weight:700;}
.prio-Baja{color:var(--muted); font-weight:600;}
.pctcell{font-family:'IBM Plex Mono',monospace; font-weight:600;}
.rowdel{
  border:none; background:transparent; color:var(--muted); cursor:pointer;
  font-size:15px; padding:2px 6px; border-radius:6px;
}
.rowdel:hover{background:var(--red-dim); color:var(--red);}

.section-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
.proj-brief{
  background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent);
  border-radius:var(--radius); padding:14px 18px; margin-bottom:18px; font-size:12.5px; color:var(--muted);
  display:flex; gap:24px; flex-wrap:wrap; box-shadow:var(--shadow);
}
.proj-brief b{color:var(--text);}
.proj-brief .problema{flex:1; min-width:260px;}
.proj-title-wrap h2{margin:0; font-size:18px; color:var(--navy); display:flex; align-items:center; gap:10px;}
.proj-title-wrap .period{font-size:12px; color:var(--muted); margin-top:2px;}

.chip-level{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:6px;}
.lvl-Alto{background:var(--red-dim); color:var(--red);}
.lvl-Medio{background:var(--amber-dim); color:#9C6A16;}
.lvl-Bajo{background:var(--green-dim); color:var(--green);}
.est-Abierto{background:var(--red-dim); color:var(--red);}
.est-EnMonitoreo{background:var(--amber-dim); color:#9C6A16;}
.est-Cerrado{background:var(--green-dim); color:var(--green);}

.footer-note{font-size:11px; color:var(--muted); margin-top:10px;}

.role-pill{
  font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:999px;
}
.role-admin{background:var(--navy); color:#fff;}
.role-viewer{background:var(--grey-dim); color:var(--muted);}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--muted); font-size:13px;
  background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius);
}

@media (max-width: 980px){
  .grid-cards{grid-template-columns:1fr;}
  .grid-summary{grid-template-columns:1fr;}
  .app.visible{flex-direction:column;}
  .sidebar{width:100%; flex:none; position:relative;}
  .main{margin-left:0;}
}
</style>

/* ---------- sincronizacion en tiempo real (Firestore) ---------- */
function saveData(){
  DATA._uidCounter = uidCounter;
  panelDocRef.set(DATA).catch(err=>{
    console.error("Error guardando en Firestore:", err);
    alert("No se pudo guardar el cambio. Revisa tu conexión a internet e intenta de nuevo.");
  });
}

function isTypingSomewhere(){
  const ae = document.activeElement;
  return ae && ["INPUT","TEXTAREA","SELECT"].includes(ae.tagName) && ae.id !== "login-user" && ae.id !== "login-pass";
}

function initRealtimeSync(){
  const loginBtn = document.getElementById("login-submit");
  loginBtn.disabled = true;
  loginBtn.textContent = "Conectando…";

  panelDocRef.onSnapshot((snap)=>{
    if(!snap.exists){
      const seed = seedData();
      panelDocRef.set(seed).catch(err=>console.error("Error inicializando datos:", err));
      return; // este mismo listener se volverá a disparar cuando el set() se complete
    }

    DATA = snap.data();
    uidCounter = DATA._uidCounter || 1000;
    migrateData();

    if(!dataReady){
      dataReady = true;
      loginBtn.disabled = false;
      loginBtn.textContent = "Ingresar";
      if(restoreSession()){
        showApp();
      }
    } else {
      handleRemoteUpdate();
    }
  }, (err)=>{
    console.error("Error de conexión con Firestore:", err);
    const errBox = document.getElementById("login-error");
    errBox.textContent = "No se pudo conectar con la base de datos. Verifica tu conexión a internet.";
    errBox.style.display = "block";
  });
}

function handleRemoteUpdate(){
  const appVisible = document.getElementById("app-root").classList.contains("visible");
  if(!appVisible) return;
  if(isTypingSomewhere()) return; // evita interrumpir mientras alguien está escribiendo
  buildNav();
  switchSection(CURRENT_TARGET);
}

========================================================================= */
function isAdmin(){ return CURRENT_USER && CURRENT_USER.role === "admin"; }

function tryLogin(username, password){
  const u = DATA.users.find(x => x.username.toLowerCase() === username.trim().toLowerCase() && x.password === password);
  if(!u) return false;
  CURRENT_USER = u;
  localStorage.setItem(SESSION_KEY, u.username);
  return true;
}
function restoreSession(){
  const uname = localStorage.getItem(SESSION_KEY);
  if(!uname) return false;
  const u = DATA.users.find(x => x.username === uname);
  if(!u) return false;
  CURRENT_USER = u;
  return true;
}
function logout(){
  localStorage.removeItem(SESSION_KEY);
  CURRENT_USER = null;
  document.getElementById("app-root").classList.remove("visible");
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("login-user").value = "";
  document.getElementById("login-pass").value = "";
  document.getElementById("login-error").style.display = "none";
}
function showApp(){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-root").classList.add("visible");
  document.getElementById("side-user-name").textContent = CURRENT_USER.nombre || CURRENT_USER.username;
  document.getElementById("side-user-role").innerHTML = isAdmin()
    ? '<span class="role-pill role-admin">Administrador</span>'
    : '<span class="role-pill role-viewer">Solo lectura</span>';
  document.getElementById("session-indicator").innerHTML =
    'Conectado como <b>' + esc(CURRENT_USER.nombre || CURRENT_USER.username) + '</b> · ' + (isAdmin()?"Administrador":"Solo lectura");
  buildNav();
  switchSection("dashboard");
}

/* =========================================================================
   HELPERS DE DATOS
========================================================================= */
function activeProjectKeys(){
  return Object.keys(DATA.projects).filter(k => DATA.projects[k].estado === "Activo");
}
function completedProjectKeys(){
  return Object.keys(DATA.projects).filter(k => DATA.projects[k].estado === "Completado");
}
function pesoEstado(estado){
  return estado==="Completada"?1: estado==="En Progreso"?0.5: estado==="Bloqueada"?0.25:0;
}
function avanceProyecto(pKey){
  const acts = DATA.projects[pKey].activities;
  if(acts.length===0) return 0;
  const sum = acts.reduce((s,a)=>s+pesoEstado(a.estado),0);
  return sum/acts.length;
}
function contarEstados(acts){
  const c = {Pendiente:0,"En Progreso":0,Completada:0,Bloqueada:0};
  acts.forEach(a=>{ c[a.estado] = (c[a.estado]||0)+1; });
  return c;
}
function nivelRiesgo(prob, impacto){
  if(!prob || !impacto) return "";
  const alto = (prob==="Alta"&&impacto==="Alta")||(prob==="Alta"&&impacto==="Media")||(prob==="Media"&&impacto==="Alta");
  if(alto) return "Alto";
  const medio = (prob==="Alta"&&impacto==="Baja")||(prob==="Media"&&impacto==="Media")||(prob==="Baja"&&impacto==="Alta");
  if(medio) return "Medio";
  return "Bajo";
}
function estadoBadgeClass(pct){
  if(pct>=0.8) return {cls:"green", label:"En buen curso"};
  if(pct>=0.4) return {cls:"amber", label:"Atención"};
  return {cls:"red", label:"Riesgo"};
}
function fmtPct(x){ return Math.round(x*100)+"%"; }
function fmtMoney(n){
  n = Number(n)||0;
  return "$" + n.toLocaleString("es-MX",{maximumFractionDigits:0});
}
function budgetReal(pKey){
  const items = DATA.projects[pKey].budgetItems || [];
  return items.reduce((s,it)=>s+(Number(it.monto)||0),0);
}
function esc(s){
  return (s===undefined||s===null?"":String(s)).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function opts(list, selected){
  return list.map(o=>`<option value="${esc(o)}" ${o===selected?"selected":""}>${esc(o)}</option>`).join("");
}
function projOptions(selected, onlyKeys){
  const keys = onlyKeys || Object.keys(DATA.projects);
  return keys.map(k=>`<option value="${k}" ${k===selected?"selected":""}>${esc(DATA.projects[k].name)}</option>`).join("");
}
function slugify(name){
  let base = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  if(!base) base = "proyecto";
  let key = base, i = 2;
  while(DATA.projects[key]){ key = base + "-" + i; i++; }
  return key;
}

function areaOf(t){
  if(t==="dashboard"||t==="terminados"||t==="riesgos"||t==="acciones"||t.startsWith("proj:")) return "proyectos";
  if(t==="pops"||t==="segmentos") return "infraestructura";
  if(t==="flotilla"||t==="unidades") return "vehiculos";
  if(t==="usuarios") return "usuarios";
  return "proyectos";
}

    html += `<div class="nav-item big" data-area="usuarios" data-target="usuarios"><span class="dot"></span>Usuarios y Cuentas</div>`;

  nav.innerHTML = html;
  nav.querySelectorAll(".nav-item").forEach(item=>{

}

    html += `<div class="subtab ${activeTarget==='dashboard'?'active':''}" data-target="dashboard">Proyectos Activos</div>`;
    activeProjectKeys().forEach(k=>{
      html += `<div class="subtab ${activeTarget==='proj:'+k?'active':''}" data-target="proj:${k}">${esc(DATA.projects[k].name)}</div>`;
    });
    html += `<div class="subtab ${activeTarget==='terminados'?'active':''}" data-target="terminados">Proyectos Terminados</div>`;
    html += `<div class="subtab ${activeTarget==='riesgos'?'active':''}" data-target="riesgos">Riesgos</div>`;
    html += `<div class="subtab ${activeTarget==='acciones'?'active':''}" data-target="acciones">Plan de Acción</div>`;
  } else if(area === "infraestructura"){
    html += `<div class="subtab ${activeTarget==='pops'?'active':''}" data-target="pops">Pops</div>`;
    html += `<div class="subtab ${activeTarget==='segmentos'?'active':''}" data-target="segmentos">Segmentos de Fibra</div>`;
  } else if(area === "vehiculos"){
    html += `<div class="subtab ${activeTarget==='flotilla'?'active':''}" data-target="flotilla">Flotilla</div>`;
    html += `<div class="subtab ${activeTarget==='unidades'?'active':''}" data-target="unidades">Unidades</div>`;
  }

  bar.innerHTML = html;
  bar.querySelectorAll(".subtab").forEach(item=>{
    item.addEventListener("click", ()=>switchSection(item.dataset.target));
  });
}

const TITLES = {
  dashboard: ["Proyectos Activos","Panorama de los proyectos del trimestre"],
  terminados: ["Proyectos Terminados","Historial de proyectos cerrados"],
  riesgos: ["Registro de Riesgos", "Gestión de riesgos de los proyectos"],
  acciones: ["Plan de Acción", "Seguimiento de próximos pasos"],
  usuarios: ["Usuarios y Cuentas", "Administración de accesos al panel"],
  pops: ["Infraestructura — Pops", "Puntos de presencia de la red"],
  segmentos: ["Infraestructura — Segmentos de Fibra", "Tramos de fibra óptica de la red"],
  flotilla: ["Flotilla de Vehículos", "Kilometraje y mantenimiento de las unidades"],
  unidades: ["Unidades — Datos Administrativos", "Placas, tarjeta de combustible y asignación por unidad"]
};

function setUpdateDate(){
  const el = document.getElementById("update-date");
  if(el) el.textContent = new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function switchSection(target){
  CURRENT_TARGET = target;
  const area = areaOf(target);
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.area===area));
  renderSubtabs(target);
  const actions = document.getElementById("page-actions");
  actions.innerHTML = "";

  if(target === "dashboard"){
    setTitle("dashboard"); renderDashboard();
  } else if(target === "terminados"){
    setTitle("terminados"); renderTerminados();
  } else if(target === "riesgos"){
    setTitle("riesgos");
    if(isAdmin()) addAction(actions, "+ Agregar riesgo", addRiesgo);
    renderRiesgos();
  } else if(target === "acciones"){
    setTitle("acciones");
    if(isAdmin()) addAction(actions, "+ Agregar acción", addAccion);
    renderAcciones();
  } else if(target === "usuarios" && isAdmin()){
    setTitle("usuarios");
    renderUsuarios();
  } else if(target === "pops"){
    setTitle("pops");
    if(isAdmin()) addAction(actions, "+ Agregar Pop", addPop);
    renderPops();
  } else if(target === "segmentos"){
    setTitle("segmentos");
    if(isAdmin()) addAction(actions, "+ Agregar segmento", addSegmento);
    renderSegmentos();
  } else if(target === "flotilla"){
    setTitle("flotilla");
    renderFlotilla();
  } else if(target === "unidades"){
    setTitle("unidades");
    if(isAdmin()) addAction(actions, "+ Agregar unidad", addUnidad);
    renderUnidades();
  } else if(target.startsWith("proj:")){
    const key = target.split(":")[1];
    renderProjectPage(key);
  } else {
    switchSection("dashboard");
    return;
  }
}
function setTitle(key){
  document.getElementById("page-title").textContent = TITLES[key][0];
  document.getElementById("page-sub").innerHTML = TITLES[key][1] + ' &nbsp;·&nbsp; Actualizado: <span class="mono" id="update-date"></span>';
  setUpdateDate();
}
function addAction(container, label, fn){
  const b = document.createElement("button");
  b.className = "btn btn-primary";
  b.textContent = label;
  b.addEventListener("click", fn);
  container.appendChild(b);
}

/* =========================================================================
   DASHBOARD (Proyectos Activos)
========================================================================= */
function renderDashboard(){
  const content = document.getElementById("content");
  const keys = activeProjectKeys();

  let cardsHtml = keys.map(pKey=>{
    const proj = DATA.projects[pKey];
    const pct = avanceProyecto(pKey);
    const c = contarEstados(proj.activities);
    const badge = estadoBadgeClass(pct);
    const real = budgetReal(pKey);
    const plan = Number(proj.budgetPlanificado)||0;
    const consumedPct = plan>0 ? Math.min(100, (real/plan)*100) : (real>0?100:0);
    const over = plan>0 && real>plan;
    return `
      <div class="card card-proj" data-goto="proj:${pKey}" style="cursor:pointer;">
        <div class="row-top">
          <div>
            <h3>${esc(proj.name)}</h3>
            <div class="meta">${esc(proj.responsable)} · ${esc(proj.coordinacion||"")}</div>
          </div>
          <div class="badges">
            <span class="q3-badge">${esc(proj.quarter || "Q3 2026")}</span>
            <span class="badge ${badge.cls}">${badge.label}</span>
          </div>
        </div>
        <div class="pct-num">${fmtPct(pct)}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct*100}%"></div></div>
        <div class="mini-stats">
          <span><b>${c["Completada"]}</b> completadas</span>
          <span><b>${c["En Progreso"]}</b> en progreso</span>
          <span><b>${c["Pendiente"]+c["Bloqueada"]}</b> pendientes</span>
        </div>
        <div class="mini-budget">
          <div class="row"><span>Presupuesto real</span><b class="${over?'':''}" style="${over?'color:var(--red);':''}">${fmtMoney(real)}</b></div>
          <div class="row"><span>Planificado</span><b>${fmtMoney(plan)}</b></div>
          <div class="track"><div class="fill" style="width:${consumedPct}%; background:${over?'var(--red)':'var(--accent)'}"></div></div>
        </div>
      </div>`;
  }).join("");

  if(isAdmin()){
    cardsHtml += `<div class="add-project-card" id="add-project-card"><span class="plus">+</span>Nuevo proyecto</div>`;
  }

  const nCompleted = completedProjectKeys().length;

  let totalAct=0, totalComp=0, totalProg=0, totalPendBloq=0;
  keys.forEach(pKey=>{
    const c = contarEstados(DATA.projects[pKey].activities);
    totalAct += DATA.projects[pKey].activities.length;
    totalComp += c["Completada"]; totalProg += c["En Progreso"]; totalPendBloq += c["Pendiente"]+c["Bloqueada"];
  });
  const globalPct = totalAct ? keys.reduce((s,k)=>s+avanceProyecto(k),0)/keys.length : 0;

  const riskCounts = {Alto:0, Medio:0, Bajo:0};
  DATA.riesgos.forEach(r=>{ const n = nivelRiesgo(r.prob,r.impacto); if(n) riskCounts[n]++; });
  const riskMax = Math.max(1, ...Object.values(riskCounts));
  const riskColors = {Alto:"var(--red)", Medio:"var(--amber)", Bajo:"var(--green)"};

  const accCounts = {Pendiente:0,"En Progreso":0,Completada:0};
  DATA.acciones.forEach(a=>{ accCounts[a.estado] = (accCounts[a.estado]||0)+1; });
  const accMax = Math.max(1, ...Object.values(accCounts));
  const accColors = {Pendiente:"var(--muted)", "En Progreso":"var(--amber)", Completada:"var(--green)"};

  content.innerHTML = `
    ${keys.length===0 ? '<div class="empty-state">No hay proyectos activos en este momento.</div>' : `<div class="grid-cards">${cardsHtml}</div>`}

    <div class="completed-link-card" id="goto-terminados">
      <div>
        <div class="l1">Historial</div>
        <div class="l2">${nCompleted} proyecto${nCompleted===1?"":"s"} terminado${nCompleted===1?"":"s"}</div>
      </div>
      <div class="arrow">→</div>
    </div>

    <div class="grid-summary">
      <div class="card">
        <p class="summary-title">Riesgos por nivel</p>
        <div>${Object.keys(riskCounts).map(k=>`
          <div class="bar-row">
            <div class="label">${k}</div>
            <div class="track"><div class="fill" style="width:${(riskCounts[k]/riskMax)*100}%; background:${riskColors[k]}"></div></div>
            <div class="val">${riskCounts[k]}</div>
          </div>`).join("")}
          <div class="footer-note">${DATA.riesgos.filter(r=>r.estado==="Abierto").length} riesgo(s) abierto(s) de ${DATA.riesgos.length} totales</div>
        </div>
      </div>
      <div class="card">
        <p class="summary-title">Plan de acción por estado</p>
        <div>${Object.keys(accCounts).map(k=>`
          <div class="bar-row">
            <div class="label">${k}</div>
            <div class="track"><div class="fill" style="width:${(accCounts[k]/accMax)*100}%; background:${accColors[k]}"></div></div>
            <div class="val">${accCounts[k]}</div>
          </div>`).join("")}
          <div class="footer-note">${DATA.acciones.length} acción(es) de seguimiento registradas</div>
        </div>
      </div>
    </div>

    <div class="grid-summary">
      <div class="card">
        <p class="summary-title">Avance por proyecto activo</p>
        <div>${keys.map(pKey=>{
          const pct = avanceProyecto(pKey);
          return `<div class="bar-row">
            <div class="label">${esc(DATA.projects[pKey].name)}</div>
            <div class="track"><div class="fill" style="width:${pct*100}%; background:var(--accent)"></div></div>
            <div class="val">${fmtPct(pct)}</div>
          </div>`;
        }).join("") || '<div class="footer-note">Sin proyectos activos.</div>'}</div>
      </div>
      <div class="card">
        <p class="summary-title">Resumen general</p>
        <div style="display:flex; flex-direction:column; gap:8px; font-size:13px;">
          <div>Actividades totales: <b class="mono">${totalAct}</b></div>
          <div>Completadas: <b class="mono">${totalComp}</b> &nbsp;·&nbsp; En progreso: <b class="mono">${totalProg}</b> &nbsp;·&nbsp; Pendientes: <b class="mono">${totalPendBloq}</b></div>
          <div>Avance global (${QUARTER_LABEL}): <b class="mono" style="color:var(--navy); font-size:16px;">${fmtPct(globalPct)}</b></div>
        </div>
      </div>
    </div>
  `;

  content.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", ()=>switchSection(el.dataset.goto));
  });
  document.getElementById("goto-terminados").addEventListener("click", ()=>switchSection("terminados"));
  const addCard = document.getElementById("add-project-card");
  if(addCard) addCard.addEventListener("click", addProject);
}

function addProject(){
  const html = `

    <div class="modal-desc">Completa la información inicial. Podrás editarla después desde la ficha del proyecto.</div>
    <div class="modal-field"><label>Título del proyecto</label><input type="text" id="np-titulo" placeholder="Ej. Backbone 100G"></div>
    <div class="modal-field"><label>Coordinación</label><select id="np-coord">${opts(COORDINACIONES)}</select></div>
    <div class="modal-row">
      <div class="modal-field"><label>Fecha inicio esperada</label><input type="date" id="np-finicio"></div>
      <div class="modal-field"><label>Fecha fin esperada</label><input type="date" id="np-ffin"></div>
    </div>
    <div class="modal-row">
      <div class="modal-field"><label>Responsable principal</label><input type="text" id="np-resp" value="César"></div>
      <div class="modal-field"><label>Corresponsable</label><input type="text" id="np-corresp"></div>
    </div>
    <div class="modal-field"><label>Budget planificado (MXN)</label><div class="money-input-wrap"><span class="currency-prefix">$</span><input type="number" id="np-budget" min="0" step="1000" placeholder="0"></div></div>
    <div class="modal-field"><label>Descripción / problema que resuelve</label><textarea id="np-problema" rows="3" placeholder="Breve contexto del proyecto"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="np-cancel">Cancelar</button>
      <button class="btn btn-primary" id="np-submit">Crear proyecto</button>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector("#np-cancel").addEventListener("click", closeModal);
  overlay.querySelector("#np-submit").addEventListener("click", ()=>{
    const name = overlay.querySelector("#np-titulo").value.trim();
    if(!name){ alert("El título del proyecto es obligatorio."); return; }
    const key = slugify(name);
    DATA.projects[key] = {
      name: name,
      quarter: "Q3 2026",
      estado: "Activo",
      coordinacion: overlay.querySelector("#np-coord").value,
      fechaInicioEsperada: overlay.querySelector("#np-finicio").value,
      fechaFinEsperada: overlay.querySelector("#np-ffin").value,
      responsable: overlay.querySelector("#np-resp").value.trim(),
      corresponsable: overlay.querySelector("#np-corresp").value.trim(),
      budgetPlanificado: Number(overlay.querySelector("#np-budget").value) || 0,
      budgetItems: [],
      problema: overlay.querySelector("#np-problema").value.trim(),
      periodo: "",
      activities: []
    };
    saveData();
    buildNav();
    closeModal();
    switchSection("proj:"+key);
  });
}

/* =========================================================================
   PAGINA DE PROYECTO (activo o terminado)
========================================================================= */
function renderProjectPage(pKey){
  const proj = DATA.projects[pKey];
  const content = document.getElementById("content");
  if(!proj){ switchSection("dashboard"); return; }

  const readonly = !isAdmin() || proj.estado === "Completado";
  const pct = avanceProyecto(pKey);

  document.getElementById("page-title").textContent = proj.name;
  document.getElementById("page-sub").innerHTML =
    (proj.estado==="Completado" ? "Proyecto terminado" : "Hoja de actividades del proyecto") +
    ' &nbsp;·&nbsp; Actualizado: <span class="mono" id="update-date"></span>';
  setUpdateDate();

  const actionsWrap = document.getElementById("page-actions");
  actionsWrap.innerHTML = "";
  if(isAdmin()){
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "btn";
    toggleBtn.textContent = proj.estado === "Completado" ? "Reactivar proyecto" : "Marcar como completado";
    toggleBtn.addEventListener("click", ()=>{
      if(proj.estado === "Completado"){
        proj.estado = "Activo";
      } else {
        if(!confirm(`¿Marcar "${proj.name}" como terminado? Pasará a Proyectos Terminados en modo solo lectura.`)) return;
        proj.estado = "Completado";
        proj.fechaCierre = new Date().toISOString().slice(0,10);
      }
      saveData();
      buildNav();
      renderSubtabs(proj.estado==="Completado" ? "terminados" : "proj:"+pKey);
      if(proj.estado==="Completado"){ switchSection("terminados"); } else { renderProjectPage(pKey); }
    });
    actionsWrap.appendChild(toggleBtn);
  }

  content.innerHTML = `
    <div class="section-header">
      <div class="proj-title-wrap">
        <h2>${esc(proj.name)} ${proj.estado==="Completado" ? '<span class="badge grey">Terminado</span>' : `<span class="q3-badge">${esc(proj.quarter||"Q3 2026")}</span>`}</h2>
        <div class="period">Avance de actividades: <b class="mono">${fmtPct(pct)}</b></div>
      </div>
      ${!readonly ? `<button class="btn btn-primary" id="btn-add-act">+ Agregar actividad</button>` : ""}
    </div>

    <div class="info-grid">
      <div class="info-cell">
        <label>Coordinación</label>
        ${readonly
          ? `<div class="readonly-text">${esc(proj.coordinacion||"—")}</div>`
          : `<select id="pi-coord">${opts(COORDINACIONES, proj.coordinacion)}</select>`}
      </div>
      <div class="info-cell">
        <label>Responsable principal</label>
        ${readonly ? `<div class="readonly-text">${esc(proj.responsable||"—")}</div>` : `<input type="text" id="pi-resp" value="${esc(proj.responsable)}">`}
      </div>
      <div class="info-cell">
        <label>Corresponsable</label>
        ${readonly ? `<div class="readonly-text">${esc(proj.corresponsable||"—")}</div>` : `<input type="text" id="pi-corresp" value="${esc(proj.corresponsable)}">`}
      </div>
      <div class="info-cell">
        <label>Fecha inicio esperada</label>
        ${readonly ? `<div class="readonly-text">${esc(proj.fechaInicioEsperada||"—")}</div>` : `<input type="date" id="pi-finicio" value="${esc(proj.fechaInicioEsperada)}">`}
      </div>
      <div class="info-cell">
        <label>Fecha fin esperada</label>
        ${readonly ? `<div class="readonly-text">${esc(proj.fechaFinEsperada||"—")}</div>` : `<input type="date" id="pi-ffin" value="${esc(proj.fechaFinEsperada)}">`}
      </div>
      <div class="info-cell">
        <label>Budget planificado</label>
        ${readonly ? `<div class="readonly-text">${fmtMoney(proj.budgetPlanificado)}</div>` : `<div class="money-input-wrap"><span class="currency-prefix">$</span><input type="number" id="pi-budget" min="0" step="1000" value="${Number(proj.budgetPlanificado)||0}"></div>`}
      </div>
    </div>

    <div class="proj-brief"><div class="problema"><b>Problema:</b> ${esc(proj.problema)}</div></div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th style="min-width:260px;">Actividad</th><th>Responsable</th><th>Inicio</th><th>Fin</th>
          <th>Estado</th><th>% Avance</th><th>Prioridad</th><th style="min-width:160px;">Notas</th>${!readonly?"<th></th>":""}
        </tr></thead>
        <tbody id="tbody-proj"></tbody>
      </table>
    </div>

    <div class="section-header">
      <div class="proj-title-wrap"><h2 style="font-size:16px;">Presupuesto y Gastos</h2></div>
      ${!readonly ? `<button class="btn btn-primary" id="btn-add-budget">+ Agregar compra / gasto</button>` : ""}
    </div>

      <table>
        <thead><tr>
          <th>#</th><th>Tipo</th><th style="min-width:260px;">Descripción</th><th>Monto</th>${!readonly?"<th>Acciones</th>":""}
        </tr></thead>
        <tbody id="tbody-budget"></tbody>
      </table>

  if(!readonly){

      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener("change", ()=>{
        proj[field] = isNum ? (Number(el.value)||0) : el.value;
        saveData();
        buildNav();
        if(id==="pi-coord"){ /* refresh dashboard meta not needed here */ }
      });
    };
    bind("pi-coord","coordinacion");
    bind("pi-resp","responsable");
    bind("pi-corresp","corresponsable");
    bind("pi-finicio","fechaInicioEsperada");
    bind("pi-ffin","fechaFinEsperada");

      <td><input type="date" value="${esc(a.fin)}" data-f="fin" ${dis}></td>
      <td><select class="status-select st-${a.estado.replace(/\s/g,'')}" data-f="estado" ${dis}>${opts(ESTADOS_ACT,a.estado)}</select></td>
      <td class="pctcell">${fmtPct(p)}</td>
      <td><select class="prio-${a.prioridad}" data-f="prioridad" ${dis}>${opts(PRIORIDADES,a.prioridad)}</select></td>
      <td><input type="text" value="${esc(a.notas)}" data-f="notas" ${dis}></td>
      ${!readonly ? `<td><button class="rowdel" title="Eliminar actividad" data-del="${a.id}">✕</button></td>` : ""}
    `;
    tbody.appendChild(tr);

    if(!readonly){
      tr.querySelectorAll("[data-f]").forEach(inp=>{
        inp.addEventListener("change", ()=>{
          a[inp.dataset.f] = inp.value;
          saveData();
          renderProjectPage(pKey);
          buildNav();
        });
      });
      tr.querySelector("[data-del]").addEventListener("click", ()=>{
        if(!confirm("¿Eliminar esta actividad?")) return;
        proj.activities = proj.activities.filter(x=>x.id!==a.id);
        saveData();
        renderProjectPage(pKey);
        buildNav();
      });
    }
  });

  const addBtn = document.getElementById("btn-add-act");
  if(addBtn){
    addBtn.addEventListener("click", ()=>{
      proj.activities.push({id:newId(), actividad:"Nueva actividad", responsable:"", inicio:"", fin:"", estado:"Pendiente", prioridad:"Media", notas:""});
      saveData();
      renderProjectPage(pKey);
      buildNav();
    });
  }

  renderBudgetSection(proj, pKey, readonly);

  const addBudgetBtn = document.getElementById("btn-add-budget");
  if(addBudgetBtn){
    addBudgetBtn.addEventListener("click", ()=>openBudgetModal(proj, pKey));
  }
}

function renderBudgetSection(proj, pKey, readonly){
  const items = proj.budgetItems || [];
  const plan = Number(proj.budgetPlanificado)||0;
  const real = budgetReal(pKey);
  const diff = plan - real;
  const over = diff < 0;

  document.getElementById("budget-summary").innerHTML = `
    <div class="budget-pill"><label>Budget Planificado</label><div class="amt">${fmtMoney(plan)}</div></div>
    <div class="budget-pill"><label>Budget Real (ejercido)</label><div class="amt ${over?'over':''}">${fmtMoney(real)}</div></div>
    <div class="budget-pill"><label>${over?"Sobregiro":"Disponible"}</label><div class="amt ${over?'over':'under'}">${fmtMoney(Math.abs(diff))}</div></div>
  `;

  const tbody = document.getElementById("tbody-budget");
  if(items.length === 0){
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--muted); padding:20px;">Sin compras ni gastos registrados.</td></tr>`;
    return;
  }
  tbody.innerHTML = "";
  items.forEach((it, idx)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="idcol">${idx+1}</td>
      <td><span class="tipo-${it.tipo}">${esc(it.tipo)}</span></td>
      <td>${esc(it.descripcion)}</td>
      <td class="mono">${fmtMoney(it.monto)}</td>
      ${!readonly ? `<td style="text-align:right;"><button class="btn-del-row" data-del="${it.id}">Eliminar</button></td>` : ""}
    `;
    tbody.appendChild(tr);
    if(!readonly){

/* =========================================================================
   PROYECTOS TERMINADOS
========================================================================= */
function renderTerminados(){
  const content = document.getElementById("content");
  const keys = completedProjectKeys();
  if(keys.length === 0){
    content.innerHTML = `<div class="empty-state">Todavía no hay proyectos terminados.<br>Cuando un proyecto se marque como completado, aparecerá aquí.</div>`;
    return;
  }
  const cards = keys.map(pKey=>{
    const proj = DATA.projects[pKey];
    const pct = avanceProyecto(pKey);
    const c = contarEstados(proj.activities);
    const real = budgetReal(pKey);
    const plan = Number(proj.budgetPlanificado)||0;
    const consumedPct = plan>0 ? Math.min(100, (real/plan)*100) : (real>0?100:0);
    const over = plan>0 && real>plan;
    return `
      <div class="card card-proj" data-goto="proj:${pKey}" style="cursor:pointer;">
        <div class="row-top">
          <div>
            <h3>${esc(proj.name)}</h3>
            <div class="meta">${esc(proj.responsable)} · ${esc(proj.coordinacion||"")}</div>
          </div>
          <span class="badge grey">Terminado ${proj.fechaCierre ? "· "+esc(proj.fechaCierre) : ""}</span>
        </div>
        <div class="pct-num">${fmtPct(pct)}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct*100}%; background:var(--muted)"></div></div>
        <div class="mini-stats">
          <span><b>${c["Completada"]}</b>/${proj.activities.length} actividades completadas</span>
        </div>
        <div class="mini-budget">
          <div class="row"><span>Presupuesto real</span><b style="${over?'color:var(--red);':''}">${fmtMoney(real)}</b></div>
          <div class="row"><span>Planificado</span><b>${fmtMoney(plan)}</b></div>
          <div class="track"><div class="fill" style="width:${consumedPct}%; background:${over?'var(--red)':'var(--accent)'}"></div></div>
        </div>
      </div>`;
  }).join("");
  content.innerHTML = `<div class="grid-cards">${cards}</div>`;
  content.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", ()=>switchSection(el.dataset.goto));
  });
}

/* =========================================================================
   VEHICULOS — FLOTILLA (dashboard de kilometraje y mantenimiento)
========================================================================= */
function maintenanceStatus(unit){
  if(!unit.fechaUltimoMantenimiento) return {cls:"grey", label:"Sin registro"};
  const days = Math.floor((Date.now() - new Date(unit.fechaUltimoMantenimiento+"T00:00:00")) / 86400000);
  if(days < 0) return {cls:"grey", label:"Sin registro"};
  if(days > 90) return {cls:"red", label:"Mantenimiento vencido"};
  if(days > 60) return {cls:"amber", label:"Revisar pronto"};
  return {cls:"green", label:"Al día"};
}
function renderFlotilla(){
  const content = document.getElementById("content");
  const readonly = !isAdmin();
  const units = DATA.fleet.units;
  const totalKm = units.reduce((s,u)=>s+(Number(u.kmActuales)||0),0);
  const avgKmSemana = units.length ? Math.round(units.reduce((s,u)=>s+(Number(u.kmPorSemana)||0),0)/units.length) : 0;
  const vencidas = units.filter(u=>maintenanceStatus(u).cls==="red").length;

  content.innerHTML = `
    <div class="budget-summary">
      <div class="budget-pill"><label>Unidades en flotilla</label><div class="amt">${units.length}</div></div>
      <div class="budget-pill"><label>Kilómetros totales</label><div class="amt">${totalKm.toLocaleString("es-MX")} km</div></div>
      <div class="budget-pill"><label>Promedio km / semana</label><div class="amt">${avgKmSemana.toLocaleString("es-MX")} km</div></div>
      <div class="budget-pill"><label>Mantenimiento vencido</label><div class="amt ${vencidas>0?'over':''}">${vencidas}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Unidad</th><th>Km actuales</th><th>Fecha último mantenimiento</th><th>Km por semana</th><th>Estado</th>
        </tr></thead>
        <tbody id="tbody-flotilla"></tbody>
      </table>
    </div>`;
  const tbody = document.getElementById("tbody-flotilla");
  units.forEach((u, idx)=>{
    const dis = readonly ? "disabled" : "";
    const st = maintenanceStatus(u);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="idcol">${idx+1}</td>
      <td><b>${esc(u.nombre)}</b></td>
      <td><input type="number" min="0" step="1" value="${Number(u.kmActuales)||0}" data-f="kmActuales" ${dis}></td>
      <td><input type="date" value="${esc(u.fechaUltimoMantenimiento)}" data-f="fechaUltimoMantenimiento" ${dis}></td>
      <td><input type="number" min="0" step="1" value="${Number(u.kmPorSemana)||0}" data-f="kmPorSemana" ${dis}></td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
    `;
    tbody.appendChild(tr);
    if(!readonly){
      tr.querySelectorAll("[data-f]").forEach(inp=>{
        inp.addEventListener("change", ()=>{
          u[inp.dataset.f] = inp.type==="number" ? (Number(inp.value)||0) : inp.value;
          saveData();
          renderFlotilla();
        });
      });
    }
  });
}

  overlay.querySelector("#un-submit").addEventListener("click", ()=>{
    const nombre = overlay.querySelector("#un-nombre").value.trim();
    if(!nombre){ alert("El nombre de la unidad es obligatorio."); return; }
    DATA.fleet.units.push({
      id:newId(), nombre:nombre,
      kmActuales:0, fechaUltimoMantenimiento:"", kmPorSemana:0,
      placas: overlay.querySelector("#un-placas").value.trim(),
      tarjetaCombustible: overlay.querySelector("#un-tarjeta").value.trim(),
      numeroSerie: overlay.querySelector("#un-serie").value.trim(),
      modelo: overlay.querySelector("#un-modelo").value.trim(),
      anio: overlay.querySelector("#un-anio").value.trim(),
      agencia: overlay.querySelector("#un-agencia").value.trim(),
      usuarioAsignado: overlay.querySelector("#un-usuario").value.trim()
    });
    saveData();
    closeModal();
    renderUnidades();
  });
}
function renderUnidades(){
  const content = document.getElementById("content");
  const readonly = !isAdmin();
  content.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Unidad</th><th>Placas</th><th>Tarjeta combustible</th><th>Núm. serie</th>
          <th>Modelo</th><th>Año</th><th>Agencia</th><th>Usuario asignado</th>${!readonly?"<th></th>":""}
        </tr></thead>
        <tbody id="tbody-unidades"></tbody>
      </table>
    </div>`;
  const tbody = document.getElementById("tbody-unidades");
  DATA.fleet.units.forEach((u, idx)=>{
    const dis = readonly ? "disabled" : "";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="idcol">${idx+1}</td>
      <td><b>${esc(u.nombre)}</b></td>
      <td><input type="text" value="${esc(u.placas)}" data-f="placas" ${dis}></td>
      <td><input type="text" value="${esc(u.tarjetaCombustible)}" data-f="tarjetaCombustible" ${dis}></td>
      <td><input type="text" value="${esc(u.numeroSerie)}" data-f="numeroSerie" ${dis}></td>
      <td><input type="text" value="${esc(u.modelo)}" data-f="modelo" ${dis}></td>
      <td><input type="text" value="${esc(u.anio)}" data-f="anio" ${dis}></td>
      <td><input type="text" value="${esc(u.agencia)}" data-f="agencia" ${dis}></td>
      <td><input type="text" value="${esc(u.usuarioAsignado)}" data-f="usuarioAsignado" ${dis}></td>
      ${!readonly ? `<td><button class="rowdel" data-del="${u.id}">✕</button></td>` : ""}
    `;
    tbody.appendChild(tr);
    if(!readonly){
      tr.querySelectorAll("[data-f]").forEach(inp=>{
        inp.addEventListener("change", ()=>{ u[inp.dataset.f]=inp.value; saveData(); });
      });
      const delBtn = tr.querySelector("[data-del]");
      if(delBtn){
        delBtn.addEventListener("click", ()=>{
          if(!confirm(`¿Eliminar la unidad "${u.nombre}"?`)) return;
          DATA.fleet.units = DATA.fleet.units.filter(x=>x.id!==u.id);
          saveData(); renderUnidades();
        });
      }
    }
  });
}

document.getElementById("login-submit").addEventListener("click", doLogin);
document.getElementById("login-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
document.getElementById("login-user").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
document.getElementById("btn-logout").addEventListener("click", logout);

function doLogin(){
  if(!dataReady) return;
  const u = document.getElementById("login-user").value;
  const p = document.getElementById("login-pass").value;
  if(tryLogin(u,p)){
    document.getElementById("login-error").style.display = "none";
    showApp();
  } else {
    document.getElementById("login-error").textContent = "Usuario o contraseña incorrectos.";
    document.getElementById("login-error").style.display = "block";
  }
}

document.getElementById("login-screen").style.display = "flex";
initRealtimeSync();
</script>
