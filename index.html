<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Proyectos — Fibranet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --navy:#0A1B33;
  --navy-2:#122845;
  --navy-3:#1B3A63;
  --line:#DCE2EC;
  --text:#122036;
  --muted:#5C6B85;
  --accent:#2AA9D9;
  --accent-dim:#DCF1FA;
  --amber:#E8A23D;
  --amber-dim:#FBEBD3;
  --green:#3FA671;
  --green-dim:#DEF2E6;
  --red:#DD5C48;
  --red-dim:#FBE2DD;
  --grey-dim:#EEF0F4;
  --radius:10px;
  --shadow:0 1px 2px rgba(10,27,51,.06), 0 6px 20px rgba(10,27,51,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}

/* ---------- login ---------- */
#login-screen{
  position:fixed; inset:0; z-index:100;
  background:radial-gradient(1200px 600px at 20% -10%, #16345A, var(--navy) 60%);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.login-card{
  width:100%; max-width:360px; background:var(--surface); border-radius:14px;
  padding:34px 30px 28px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  text-align:center;
}
.login-logo-wrap{
  width:84px; height:84px; border-radius:20px; background:#fff;
  display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
  box-shadow:0 10px 28px rgba(10,27,51,.16), 0 0 0 1px var(--line);
}
.login-logo{width:100%; height:100%; object-fit:contain; padding:12px;}
.login-brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:21px; color:var(--navy); letter-spacing:.2px;}
.login-brand .accent-n{color:var(--accent);}
.login-sub{font-size:11.5px; color:var(--muted); margin:2px 0 22px;}
.login-field{text-align:left; margin-bottom:14px;}
.login-field label{display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
.login-field input{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
  font-family:inherit; font-size:13.5px; background:#FAFBFD;
}
.login-field input:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-dim);}
.login-error{
  font-size:12px; color:var(--red); background:var(--red-dim); border-radius:8px;
  padding:8px 10px; margin-bottom:14px; display:none;
}
.login-btn{
  width:100%; padding:11px; border:none; border-radius:8px; background:var(--navy);
  color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;
  transition:background .12s;
}
.login-btn:hover{background:var(--navy-3);}
.login-hint{font-size:10.5px; color:#9FB3D1; margin-top:18px; line-height:1.5;}

/* ---------- layout ---------- */
.app{display:none;}
.app.visible{display:flex; min-height:100vh;}

.sidebar{
  width:250px; flex:0 0 250px;
  background:linear-gradient(180deg,var(--navy),var(--navy-2) 70%);
  color:#EAF1FB;
  padding:22px 16px;
  position:relative;
  overflow:hidden;
}
.sidebar::after{
  content:"";
  position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,transparent,var(--accent) 40%,#8FE3FF 55%,var(--accent) 70%,transparent);
  background-size:220% 100%;
  animation:pulse 5s linear infinite;
}
@keyframes pulse{0%{background-position:0% 0;}100%{background-position:-220% 0;}}
@media (prefers-reduced-motion: reduce){ .sidebar::after{animation:none;} }

.brand-card{
  display:flex; align-items:center; gap:13px;
  background:linear-gradient(155deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;
  padding:14px 14px;
  margin-bottom:16px;
}
.brand-mark{
  width:52px;height:52px;border-radius:13px;
  background:#fff; flex:0 0 52px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.5) inset;
  overflow:hidden;
}
.brand-mark img{width:100%; height:100%; object-fit:contain; padding:6px;}
.brand-text{line-height:1.2;}
.brand-text b{display:block;font-size:17px;letter-spacing:.3px; color:#fff;}
.brand-text span{
  display:block;font-size:10px;color:var(--accent); font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; margin-top:3px;
}
.brand-sub{
  font-size:10.5px; color:#8FA5C8; padding:0 4px 16px; line-height:1.4; border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:8px;
}

.nav-group-label{
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:#7E93B8; margin:16px 10px 8px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:8px; cursor:pointer;
  color:#C8D6EC; font-size:13.5px; font-weight:500;
  margin-bottom:2px; transition:background .12s ease, color .12s ease;
  border:1px solid transparent;
}
.nav-item .dot{width:7px;height:7px;border-radius:50%; background:#4A5F82; flex:0 0 7px;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(42,169,217,.16); color:#fff; border-color:rgba(42,169,217,.35);}
.nav-item.active .dot{background:var(--accent); box-shadow:0 0 0 3px rgba(42,169,217,.25);}
.nav-item .pct{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8FA5C8;}
.nav-item .tag-done{margin-left:auto; font-size:9.5px; background:rgba(63,166,113,.22); color:#8FE3B8; padding:2px 6px; border-radius:5px; font-weight:700;}
.nav-item.big{
  font-size:14.5px; font-weight:600; padding:12px 12px;
}
.nav-item.big .dot{width:8px; height:8px;}

/* ---------- subtabs (dentro de "Proyectos") ---------- */
.subtabs{
  display:flex; align-items:center; gap:4px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); margin-bottom:22px; padding-bottom:0;
}
.subtab{
  padding:9px 15px; font-size:12.5px; font-weight:600; color:var(--muted);
  cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
  transition:color .12s, border-color .12s;
}
.subtab:hover{color:var(--navy);}
.subtab.active{color:var(--accent); border-bottom-color:var(--accent);}

.subtabs2{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin:-14px 0 22px; padding:8px 10px; background:var(--grey-dim); border-radius:9px;
}
.subtabs2 .subtab2-label{
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
  color:#9AA6BC; padding:0 8px 0 2px; white-space:nowrap;
}
.subtab2{
  padding:6px 13px; font-size:12px; font-weight:600; color:var(--muted);
  cursor:pointer; border-radius:7px; white-space:nowrap; background:transparent;
  transition:background .12s, color .12s;
}
.subtab2:hover{background:#E4E8F0; color:var(--navy);}
.subtab2.active{background:var(--navy); color:#fff;}
.subtab2-add{
  padding:6px 12px; font-size:12px; font-weight:700; color:var(--accent);
  cursor:pointer; border-radius:7px; background:transparent; border:1px dashed var(--accent);
}
.subtab2-add:hover{background:var(--accent-dim);}
.subtab-sep{
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:#B9C2D4; padding:9px 10px 9px 18px; white-space:nowrap;
  border-left:1px solid var(--line); margin-left:6px;
}

/* ---------- session indicator ---------- */
.session-indicator{
  font-size:11px; color:var(--muted); text-align:right;
}
.session-indicator b{color:var(--text); font-weight:600;}

/* ---------- modal ---------- */
#save-toast{
  position:fixed; bottom:20px; right:20px; z-index:500;
  background:var(--navy); color:#fff; padding:10px 16px; border-radius:8px;
  font-size:12.5px; font-weight:600; box-shadow:0 8px 20px rgba(0,0,0,.25);
  opacity:0; transition:opacity .25s ease; pointer-events:none;
}
#save-toast.ok{background:var(--green);}
#save-toast.error{background:var(--red);}
#save-toast.saving{background:var(--navy);}

.modal-overlay{
  position:fixed; inset:0; background:rgba(10,20,35,.55); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-card{
  background:var(--surface); border-radius:14px; padding:26px 26px 22px;
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.3);
}
.modal-card h3{margin:0 0 4px; font-size:17px; color:var(--navy);}
.modal-card .modal-desc{font-size:12px; color:var(--muted); margin-bottom:18px;}
.modal-field{margin-bottom:14px; text-align:left;}
.modal-field label{display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
.modal-field input, .modal-field select, .modal-field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  font-family:inherit; font-size:13px; background:#FAFBFD;
}
.modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus{
  outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-dim);
}
.modal-field textarea{resize:vertical;}
.modal-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}
.modal-card.wide{max-width:680px;}
.modal-group-title{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  color:var(--accent); margin:18px 0 10px; padding-top:14px; border-top:1px solid var(--line);
}
.modal-group-title:first-of-type{margin-top:2px; padding-top:0; border-top:none;}
.modal-grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}

.table-wrap.tall{max-height:560px; overflow-y:auto; position:relative;}
.table-wrap.tall thead th{position:sticky; top:0; z-index:2;}
.link-btn{
  border:none; background:transparent; color:var(--accent); cursor:pointer;
  font-size:11.5px; font-weight:700; padding:4px 8px; border-radius:6px; font-family:inherit;
}
.link-btn:hover{background:var(--accent-dim);}

/* ---------- mapa Red de Fibra Óptica ---------- */
#red-fibra-map{width:100%; height:560px; border-radius:12px; border:1px solid var(--line); z-index:1;}
.coord-pin{font-size:24px; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); text-align:center;}
.upload-btn-label{display:inline-flex; align-items:center; gap:6px; cursor:pointer;}
@media (max-width: 640px){
  #red-fibra-map{height:380px;}
}

/* ---------- info panel de proyecto ---------- */
.info-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:18px;
  box-shadow:var(--shadow);
}
.info-cell{background:var(--surface); padding:12px 14px;}
.info-cell label{display:block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:5px;}
.info-cell input, .info-cell select{
  width:100%; border:1px solid transparent; background:transparent; font-family:inherit;
  font-size:13px; font-weight:600; padding:3px 4px; border-radius:6px; color:var(--text);
}
.info-cell input:hover, .info-cell select:hover{background:var(--grey-dim);}
.info-cell input:focus, .info-cell select:focus{outline:none; background:#fff; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-dim);}
.info-cell input:disabled, .info-cell select:disabled{background:transparent; color:var(--text); opacity:1; -webkit-text-fill-color:var(--text);}
.info-cell.readonly-text{font-size:13px; font-weight:600; color:var(--text); padding-top:13px;}

/* ---------- presupuesto ---------- */
.budget-summary{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
.budget-pill{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 18px; flex:1; min-width:150px; box-shadow:var(--shadow);
}
.budget-pill.drill{cursor:pointer; transition:border-color .12s, transform .12s;}
.budget-pill.drill:hover{border-color:var(--accent); transform:translateY(-1px);}
.budget-pill label{display:block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:4px;}
.budget-pill .amt{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:18px; color:var(--navy);}
.amt{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:18px; color:var(--navy);}
#distancia-resultado.distancia-ok .amt{color:var(--green);}
#distancia-resultado.distancia-warn .amt{color:#9C6A16;}
#distancia-resultado.distancia-danger .amt{color:var(--red);}
#distancia-resultado.distancia-loading .amt{color:var(--muted);}
.budget-pill .amt.over{color:var(--red);}
.budget-pill .amt.under{color:var(--green);}
.budget-pill .amt.warn{color:#9C6A16;}
.chk-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px 14px; margin-bottom:4px;}
.modal-field .chk-item{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--navy); font-weight:400; text-transform:none; letter-spacing:normal;}
.modal-field .chk-item input{width:auto; padding:0; border:none; background:none; accent-color:var(--accent);}
.file-drop{border:1px dashed var(--line); border-radius:8px; padding:10px 12px; font-size:12px; color:var(--muted); display:flex; align-items:center; flex-wrap:wrap;}
.attach-link{color:var(--accent); text-decoration:underline; font-size:12.5px; font-weight:600;}
.tipo-Compra{background:var(--accent-dim); color:#0E6E93; font-weight:700; padding:3px 9px; border-radius:6px; font-size:11px;}
.tipo-Gasto{background:var(--amber-dim); color:#9C6A16; font-weight:700; padding:3px 9px; border-radius:6px; font-size:11px;}
.mini-budget{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.mini-budget .row{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px;}
.mini-budget .row b{color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:600;}
.mini-budget .track{height:6px; border-radius:999px; background:var(--grey-dim); overflow:hidden;}
.mini-budget .fill{height:100%; border-radius:999px;}

/* ---------- prefijo de moneda ---------- */
.money-input-wrap{position:relative;}
.money-input-wrap .currency-prefix{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  font-size:13px; color:var(--muted); font-weight:600; pointer-events:none;
}
.money-input-wrap input{padding-left:20px !important;}
.info-cell .money-input-wrap .currency-prefix{left:5px; font-size:13px;}
.info-cell .money-input-wrap input{padding-left:15px !important;}

.btn-del-row{
  border:1px solid var(--red-dim); background:var(--red-dim); color:var(--red);
  padding:5px 12px; border-radius:7px; font-size:11.5px; font-weight:700;
  cursor:pointer; font-family:inherit;
}
.btn-del-row:hover{background:var(--red); color:#fff; border-color:var(--red);}

.sidebar-user{
  position:absolute; bottom:0; left:0; right:0;
  padding:14px 16px 18px; border-top:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.12);
}
.sidebar-user .who{font-size:12.5px; font-weight:600; color:#EAF1FB;}
.sidebar-user .role{font-size:10.5px; color:#8FA5C8; margin-bottom:8px;}
.sidebar-user button{
  width:100%; padding:7px; border-radius:7px; border:1px solid rgba(255,255,255,.16);
  background:transparent; color:#C8D6EC; font-family:inherit; font-size:11.5px; cursor:pointer;
}
.sidebar-user button:hover{background:rgba(255,255,255,.08); color:#fff;}

.main{flex:1; min-width:0; padding:26px 34px 60px;}
.topbar{
  display:flex; align-items:flex-end; justify-content:space-between;
  margin-bottom:22px; gap:16px; flex-wrap:wrap;
}
.topbar h1{font-size:22px; margin:0 0 4px; font-weight:700; color:var(--navy);}
.topbar .sub{color:var(--muted); font-size:12.5px;}
.topbar .actions{display:flex; gap:8px;}

.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600;
  cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px;
  transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--accent); background:var(--accent-dim);}
.btn-primary{background:var(--navy); color:#fff; border-color:var(--navy);}
.btn-primary:hover{background:var(--navy-3); border-color:var(--navy-3);}
.btn-danger{color:var(--red);}
.btn-danger:hover{background:var(--red-dim); border-color:var(--red);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--grey-dim);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn:disabled:hover{background:var(--surface); border-color:var(--line);}

.viewer-banner{
  background:var(--amber-dim); color:#9C6A16; border:1px solid #F0D4A0; border-radius:8px;
  padding:8px 14px; font-size:12px; font-weight:600; margin-bottom:18px; display:flex; align-items:center; gap:8px;
}

/* ---------- cards / dashboard ---------- */
.q3-badge{
  font-size:10px; font-weight:700; letter-spacing:.04em; padding:3px 9px; border-radius:999px;
  background:var(--accent-dim); color:#0E6E93; white-space:nowrap;
}
.grid-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px; margin-bottom:24px;}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow);
}
.card-proj{display:flex; flex-direction:column; gap:10px;}
.card-proj .row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.card-proj h3{margin:0; font-size:14.5px; color:var(--navy);}
.card-proj .meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
.card-proj .badges{display:flex; gap:6px; flex-direction:column; align-items:flex-end;}
.badge{
  font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.02em;
  white-space:nowrap;
}
.badge.green{background:var(--green-dim); color:var(--green);}
.badge.amber{background:var(--amber-dim); color:#9C6A16;}
.badge.red{background:var(--red-dim); color:var(--red);}
.badge.grey{background:var(--grey-dim); color:var(--muted);}

.progress-track{height:8px; border-radius:999px; background:var(--grey-dim); overflow:hidden;}
.progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),#7ED2EE);}
.pct-num{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:20px; color:var(--navy);}

.mini-stats{display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin-top:2px;}
.mini-stats b{color:var(--text); font-family:'IBM Plex Mono',monospace;}

.add-project-card{
  border:1.5px dashed var(--line); border-radius:var(--radius); background:transparent;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
  color:var(--muted); font-weight:600; font-size:12.5px; cursor:pointer; min-height:120px;
  transition:border-color .12s, color .12s, background .12s;
}
.add-project-card:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}
.add-project-card .plus{font-size:22px; line-height:1;}

.grid-summary{display:grid; grid-template-columns:repeat(auto-fit, minmax(360px, 1fr)); gap:14px; margin-bottom:24px;}
.summary-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 12px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12.5px;}
.bar-row .label{width:96px; flex:0 0 96px; color:var(--muted);}
.bar-row .track{flex:1; height:10px; background:var(--grey-dim); border-radius:999px; overflow:hidden;}
.bar-row .fill{height:100%; border-radius:999px;}
.bar-row .val{width:26px; text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:600;}
.bar-row .label.wide{width:150px; flex:0 0 150px;}

/* ---------- donut / pastel ---------- */
.donut-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
.donut{width:132px; height:132px; border-radius:50%; position:relative; flex:0 0 132px;}
.donut-hole{
  position:absolute; inset:20px; background:var(--surface); border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.donut-total{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:19px; color:var(--navy);}
.donut-total-label{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
.donut-legend{display:flex; flex-direction:column; gap:7px; font-size:12px; flex:1; min-width:140px;}
.legend-row{display:flex; align-items:center; gap:7px; color:var(--muted);}
.legend-dot{width:9px; height:9px; border-radius:50%; flex:0 0 9px;}
.legend-row b{color:var(--text); margin-left:auto; padding-left:10px; font-family:'IBM Plex Mono',monospace;}

.bar-row.drill{cursor:pointer; border-radius:6px; transition:background .12s;}
.bar-row.drill:hover{background:var(--grey-dim);}
.bar-row.drill:hover .label{color:var(--navy); text-decoration:underline;}
.legend-row.drill{cursor:pointer; border-radius:6px; padding:2px 4px; margin:-2px -4px; transition:background .12s;}
.legend-row.drill:hover{background:var(--grey-dim); color:var(--navy);}

/* ---------- metas mensuales por coordinación ---------- */
.coord-metas{display:flex; gap:16px; flex-wrap:wrap; margin:2px 0 14px; padding-left:2px;}
.meta-item{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted);}
.meta-item .meta-label{font-weight:700; text-transform:uppercase; letter-spacing:.04em; font-size:10px; color:#9AA6BC;}
.meta-item input{
  width:50px; padding:3px 5px; border:1px solid var(--line); border-radius:5px;
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-align:center; background:#FAFBFD;
}
.meta-item input:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 2px var(--accent-dim);}
.meta-item .meta-value{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--text); width:34px; text-align:center;}
.meta-status{
  display:inline-flex; align-items:center; justify-content:center;
  width:17px; height:17px; border-radius:50%; font-size:11px; font-weight:700; flex:0 0 17px;
}
.meta-status.met{background:var(--green-dim); color:var(--green);}
.meta-status.unmet{background:var(--red-dim); color:var(--red);}
.meta-status.pending{background:var(--grey-dim); color:#9AA6BC;}
.meta-status.none{background:transparent; color:transparent;}

/* ---------- comparativo de presupuesto ---------- */
.budget-compare-row{margin-bottom:14px;}
.budget-compare-row .proj-name{font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:5px;}
.budget-compare-bar{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); margin-bottom:3px;}
.budget-compare-bar .bc-label{width:72px; flex:0 0 72px;}
.budget-compare-bar .track{flex:1; height:9px; background:var(--grey-dim); border-radius:999px; overflow:hidden;}
.budget-compare-bar .fill{height:100%; border-radius:999px;}
.budget-compare-bar .val{width:100px; flex:0 0 100px; text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:600;}

.completed-link-card{
  background:var(--navy); color:#fff; border-radius:var(--radius); padding:16px 18px;
  display:flex; align-items:center; justify-content:space-between; cursor:pointer; margin-bottom:24px;
  box-shadow:var(--shadow);
}
.completed-link-card:hover{background:var(--navy-3);}
.completed-link-card .l1{font-size:12px; color:#9FB3D1; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px;}
.completed-link-card .l2{font-size:16px; font-weight:700;}
.completed-link-card .arrow{font-size:20px; color:var(--accent);}

/* ---------- tables ---------- */
.table-wrap{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow-x:auto; margin-bottom:18px;
}
table{border-collapse:collapse; width:100%; min-width:960px;}
thead th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  color:#fff; background:var(--navy-2); padding:10px 12px; font-weight:600; white-space:nowrap;
}
thead th:first-child{border-top-left-radius:var(--radius);}
thead th:last-child{border-top-right-radius:var(--radius);}
tbody td{padding:7px 12px; border-bottom:1px solid var(--line); font-size:12.5px; vertical-align:middle;}
tbody tr:nth-child(even){background:#FAFBFD;}
tbody tr:hover{background:var(--accent-dim);}
td.idcol{font-family:'IBM Plex Mono',monospace; color:var(--muted); width:28px;}
td input[type=text], td input[type=date], td input[type=password], td textarea, td select{
  width:100%; border:1px solid transparent; background:transparent; font-family:inherit;
  font-size:12.5px; padding:5px 6px; border-radius:6px; color:var(--text);
}
td input:hover, td select:hover, td textarea:hover{background:var(--grey-dim);}
td input:focus, td select:focus, td textarea:focus{
  outline:none; background:#fff; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-dim);
}
td input:disabled, td select:disabled, td textarea:disabled{
  background:transparent; color:var(--text); opacity:1; -webkit-text-fill-color:var(--text); cursor:default;
}
td textarea{resize:vertical; min-height:30px;}
select.status-select{font-weight:600; border-radius:6px; padding:5px 8px;}
.st-Pendiente{background:var(--grey-dim); color:#5C6B85;}
.st-EnProgreso{background:var(--amber-dim); color:#9C6A16;}
.st-Completada{background:var(--green-dim); color:var(--green);}
.st-Bloqueada{background:var(--red-dim); color:var(--red);}
.st-Iniciado{background:var(--accent-dim); color:#0E6E93;}
.st-Terminado{background:var(--green-dim); color:var(--green);}
.st-Pausado{background:var(--amber-dim); color:#9C6A16;}
.st-Cancelado{background:var(--red-dim); color:var(--red);}
.prio-Alta{color:var(--red); font-weight:700;}
.prio-Media{color:#9C6A16; font-weight:700;}
.prio-Baja{color:var(--muted); font-weight:600;}
.pctcell{font-family:'IBM Plex Mono',monospace; font-weight:600;}
.rowdel{
  border:none; background:transparent; color:var(--muted); cursor:pointer;
  font-size:15px; padding:2px 6px; border-radius:6px;
}
.rowdel:hover{background:var(--red-dim); color:var(--red);}

.evidence-cell{display:flex; gap:3px; align-items:center;}
.evidence-cell input{min-width:70px;}
.icon-btn{
  flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:6px; padding:4px 7px; font-size:11px; cursor:pointer; line-height:1;
}
.icon-btn:hover{background:var(--accent-dim); color:var(--accent); border-color:var(--accent);}

.section-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
.proj-brief{
  background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent);
  border-radius:var(--radius); padding:14px 18px; margin-bottom:18px; font-size:12.5px; color:var(--muted);
  display:flex; gap:24px; flex-wrap:wrap; box-shadow:var(--shadow);
}
.proj-brief b{color:var(--text);}
.proj-brief .problema{flex:1; min-width:260px;}
.proj-title-wrap h2{margin:0; font-size:18px; color:var(--navy); display:flex; align-items:center; gap:10px;}
.proj-title-wrap .period{font-size:12px; color:var(--muted); margin-top:2px;}

.chip-level{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:6px;}
.lvl-Alto{background:var(--red-dim); color:var(--red);}
.lvl-Medio{background:var(--amber-dim); color:#9C6A16;}
.lvl-Bajo{background:var(--green-dim); color:var(--green);}
.est-Abierto{background:var(--red-dim); color:var(--red);}
.est-EnMonitoreo{background:var(--amber-dim); color:#9C6A16;}
.est-Cerrado{background:var(--green-dim); color:var(--green);}

.footer-note{font-size:11px; color:var(--muted); margin-top:10px;}

.role-pill{
  font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:999px;
}
.role-admin{background:var(--navy); color:#fff;}
.role-editor{background:var(--accent-dim); color:#0E6E93;}
.role-viewer{background:var(--grey-dim); color:var(--muted);}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--muted); font-size:13px;
  background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius);
}

@media (max-width: 980px){
  .app.visible{flex-direction:column;}
  .sidebar{width:100%; flex:none; position:relative; padding:14px 14px 10px;}
  .sidebar::after{display:none;}
  .brand-card{margin-bottom:10px;}
  .brand-sub{padding-bottom:10px; margin-bottom:8px;}
  #nav-container{display:flex; gap:6px; flex-wrap:wrap;}
  .nav-item.big{padding:8px 12px; font-size:13px; flex:0 0 auto;}
  .sidebar-user{position:relative; margin-top:10px; padding:10px 0 0; border-top:1px solid rgba(255,255,255,.08); background:transparent;}
  .main{padding:18px 16px 50px;}
  .topbar{gap:10px;}
  .topbar h1{font-size:19px;}
  .subtabs, .subtabs2{gap:2px;}
  .subtab, .subtab2{padding:8px 11px; font-size:12px;}
}

@media (max-width: 640px){
  body{font-size:13.5px;}
  .main{padding:14px 12px 44px;}
  .topbar{flex-direction:column; align-items:flex-start;}
  .topbar > div:last-child{align-items:flex-start; width:100%;}
  .session-indicator{text-align:left;}
  .actions{width:100%;}
  .actions .btn{flex:1;}
  .login-card{padding:26px 20px 22px;}
  table{min-width:720px;}
  .budget-summary{flex-direction:column;}
  .budget-pill{min-width:0;}
  .donut-wrap{gap:14px;}
  .modal-card{padding:20px 18px 18px;}
  .modal-row{grid-template-columns:1fr;}
  .chk-grid{grid-template-columns:1fr;}
}

/* ---------- calendario de mantenimientos ---------- */
.cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
.cal-header h2{margin:0; font-size:16px; color:var(--navy); text-transform:capitalize;}
.cal-nav{display:flex; align-items:center; gap:8px;}
.cal-nav-btn{
  border:1px solid var(--line); background:var(--surface); color:var(--navy); border-radius:8px;
  width:32px; height:32px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.cal-nav-btn:hover{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
.cal-nav-today{
  border:1px solid var(--line); background:var(--surface); color:var(--navy); border-radius:8px;
  padding:0 12px; height:32px; font-size:11.5px; font-weight:700; cursor:pointer;
}
.cal-nav-today:hover{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
.cal-legend{display:flex; gap:16px; font-size:11px; color:var(--muted); margin-bottom:12px; flex-wrap:wrap;}
.cal-legend .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:middle;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:22px;}
.cal-dow{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); text-align:center; padding-bottom:4px;}
.cal-cell{
  background:var(--surface); border:1px solid var(--line); border-radius:8px; min-height:92px;
  padding:6px 7px; display:flex; flex-direction:column; gap:3px;
}
.cal-cell.outside{background:#FAFBFD; border-style:dashed; opacity:.55;}
.cal-cell.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.cal-daynum{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); font-weight:600;}
.cal-event{
  font-size:10px; padding:2px 6px; border-radius:5px; cursor:pointer; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; font-weight:600;
}
.cal-event:hover{filter:brightness(0.94);}
.cal-event.green{background:var(--green-dim); color:var(--green);}
.cal-event.amber{background:var(--amber-dim); color:#9C6A16;}
.cal-event.red{background:var(--red-dim); color:var(--red);}
.cal-event-more{font-size:10px; color:var(--muted); cursor:pointer; font-weight:600;}
.cal-event-more:hover{color:var(--accent);}
@media (max-width: 980px){
  .cal-grid{grid-template-columns:repeat(7,minmax(0,1fr));}
  .cal-cell{min-height:64px; padding:4px 5px;}
  .cal-event{font-size:9px;}
}
</style>
</head>

/* ---------- sincronizacion en tiempo real (Firestore) ---------- */
function saveData(retryCount){
  retryCount = retryCount || 0;
  DATA._uidCounter = uidCounter;
  showSaveToast(retryCount === 0 ? "Guardando…" : "Reintentando guardar…", "saving");
  return panelDocRef.set(DATA).then(()=>{
    showSaveToast("Guardado ✓", "ok");
  }).catch(err=>{
    console.error("Error guardando en Firestore:", err);
    if(retryCount < 1){
      return new Promise(resolve=>setTimeout(resolve, 1500)).then(()=>saveData(retryCount+1));
    }
    showSaveToast("⚠ No se pudo guardar — revisa tu conexión", "error");
    alert("No se pudo guardar el cambio. Revisa tu conexión a internet e intenta de nuevo.");
  });
}

let saveToastTimer = null;
function showSaveToast(message, tone){
  let toast = document.getElementById("save-toast");
  if(!toast){
    toast = document.createElement("div");
    toast.id = "save-toast";
    document.body.appendChild(toast);
  }
  toast.className = tone || "";
  toast.textContent = message;
  toast.style.opacity = "1";
  clearTimeout(saveToastTimer);
  saveToastTimer = setTimeout(()=>{ toast.style.opacity = "0"; }, tone === "error" ? 6000 : 1500);
}

function isTypingSomewhere(){
  const ae = document.activeElement;
  return ae && ["INPUT","TEXTAREA","SELECT"].includes(ae.tagName) && ae.id !== "login-user" && ae.id !== "login-pass";
}

function initRealtimeSync(){
  const loginBtn = document.getElementById("login-submit");
  loginBtn.disabled = true;
  loginBtn.textContent = "Conectando…";

  panelDocRef.onSnapshot((snap)=>{
    if(!snap.exists){
      const seed = seedData();
      panelDocRef.set(seed).catch(err=>console.error("Error inicializando datos:", err));
      return; // este mismo listener se volverá a disparar cuando el set() se complete
    }

    DATA = snap.data();
    uidCounter = DATA._uidCounter || 1000;
    const migrated = migrateData();
    if(migrated){ saveData(); }

    if(!dataReady){
      dataReady = true;
      loginBtn.disabled = false;
      loginBtn.textContent = "Ingresar";
      if(restoreSession()){
        showApp();
      }
    } else {
      handleRemoteUpdate();
    }
  }, (err)=>{
    console.error("Error de conexión con Firestore:", err);
    const errBox = document.getElementById("login-error");
    errBox.textContent = "No se pudo conectar con la base de datos. Verifica tu conexión a internet.";
    errBox.style.display = "block";
  });
}

function handleRemoteUpdate(){
  const appVisible = document.getElementById("app-root").classList.contains("visible");
  if(!appVisible) return;
  if(isTypingSomewhere()) return; // evita interrumpir mientras alguien está escribiendo
  buildNav();
  switchSection(CURRENT_TARGET);
}

function tryLogin(username, password){
  const u = DATA.users.find(x => x.username.toLowerCase() === username.trim().toLowerCase() && x.password === password);
  if(!u) return false;
  CURRENT_USER = u;
  localStorage.setItem(SESSION_KEY, u.username);
  return true;
}
function restoreSession(){
  const uname = localStorage.getItem(SESSION_KEY);
  if(!uname) return false;
  const u = DATA.users.find(x => x.username === uname);
  if(!u) return false;
  CURRENT_USER = u;
  return true;
}
function logout(){
  stopConnectionHeartbeat();
  if(CURRENT_USER && DATA.connectionLog && DATA.connectionLog[CURRENT_USER.username]){
    DATA.connectionLog[CURRENT_USER.username].sessionLastSeen = new Date().toISOString();
    saveData();
  }
  localStorage.removeItem(SESSION_KEY);
  CURRENT_USER = null;
  document.getElementById("app-root").classList.remove("visible");
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("login-user").value = "";
  document.getElementById("login-pass").value = "";
  document.getElementById("login-error").style.display = "none";
}

let connectionHeartbeatTimer = null;
function registerConnection(){
  if(!DATA.connectionLog) DATA.connectionLog = {};
  const now = new Date().toISOString();
  const prev = DATA.connectionLog[CURRENT_USER.username];
  DATA.connectionLog[CURRENT_USER.username] = {
    nombre: CURRENT_USER.nombre || CURRENT_USER.username,
    role: CURRENT_USER.role,
    sessionStart: now,
    sessionLastSeen: now,
    // sesión previa: se conserva tal como quedó, para no perderla al iniciar una nueva
    prevSessionStart: prev ? (prev.sessionStart || prev.lastLoginAt || null) : null,
    prevSessionEnd: prev ? (prev.sessionLastSeen || prev.lastActivityAt || null) : null
  };
  saveData();
}
function startConnectionHeartbeat(){
  stopConnectionHeartbeat();
  connectionHeartbeatTimer = setInterval(()=>{
    if(!CURRENT_USER || !DATA.connectionLog || !DATA.connectionLog[CURRENT_USER.username]) return;
    DATA.connectionLog[CURRENT_USER.username].sessionLastSeen = new Date().toISOString();
    saveData();
  }, 120000); // cada 2 minutos, mientras la pestaña siga abierta
}
function stopConnectionHeartbeat(){
  if(connectionHeartbeatTimer){ clearInterval(connectionHeartbeatTimer); connectionHeartbeatTimer = null; }
}

function showApp(){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-root").classList.add("visible");
  document.getElementById("side-user-name").textContent = CURRENT_USER.nombre || CURRENT_USER.username;
  const roleClass = isAdmin() ? "role-admin" : isEditor() ? "role-editor" : "role-viewer";
  document.getElementById("side-user-role").innerHTML =
    `<span class="role-pill ${roleClass}">${roleLabel(CURRENT_USER.role)}</span>`;
  document.getElementById("session-indicator").innerHTML =
    'Conectado como <b>' + esc(CURRENT_USER.nombre || CURRENT_USER.username) + '</b> · ' + roleLabel(CURRENT_USER.role);
  registerConnection();
  startConnectionHeartbeat();
  buildNav();
  switchSection("ejecutivo");
}

function pesoEstado(estado){
  return estado==="Completada"?1: estado==="En Progreso"?0.5: estado==="Bloqueada"?0.25:0;
}
function avanceProyecto(pKey){
  const acts = DATA.projects[pKey].activities;
  if(acts.length===0) return 0;
  const totalPond = acts.reduce((s,a)=>s+(Number(a.ponderacion)||0),0);
  if(totalPond > 0){
    const sum = acts.reduce((s,a)=>s+pesoEstado(a.estado)*(Number(a.ponderacion)||0),0);
    return sum/totalPond;
  }
  const sum = acts.reduce((s,a)=>s+pesoEstado(a.estado),0);
  return sum/acts.length;
}

  const acts = DATA.projects[pKey].activities;

function mesEstadoTemporal(monthIndex){
  const today = new Date();
  const start = new Date(META_YEAR, monthIndex, 1);
  const end = new Date(META_YEAR, monthIndex+1, 0, 23, 59, 59);
  if(today > end) return "past";
  if(today >= start && today <= end) return "current";
  return "future";
}
function contarEstados(acts){
  const c = {Pendiente:0,"En Progreso":0,Completada:0,Bloqueada:0};
  acts.forEach(a=>{ c[a.estado] = (c[a.estado]||0)+1; });
  return c;
}
function nivelRiesgo(prob, impacto){
  if(!prob || !impacto) return "";
  const alto = (prob==="Alta"&&impacto==="Alta")||(prob==="Alta"&&impacto==="Media")||(prob==="Media"&&impacto==="Alta");
  if(alto) return "Alto";
  const medio = (prob==="Alta"&&impacto==="Baja")||(prob==="Media"&&impacto==="Media")||(prob==="Baja"&&impacto==="Alta");
  if(medio) return "Medio";
  return "Bajo";
}
function estadoBadgeClass(pct){
  if(pct>=0.8) return {cls:"green", label:"En buen curso"};

  return {cls:"red", label:"Riesgo"};

function fmtPct(x){ return Math.round(x*100)+"%"; }
function fmtMoney(n){
  n = Number(n)||0;
  return "$" + n.toLocaleString("es-MX",{maximumFractionDigits:0});
}
function buildDonut(segments, drillType){
  const total = segments.reduce((s,x)=>s+(Number(x.value)||0),0);
  let acc = 0;
  const stops = total>0 ? segments.map(seg=>{
    const start = acc/total*360;
    acc += (Number(seg.value)||0);
    const end = acc/total*360;
    return `${seg.color} ${start}deg ${end}deg`;
  }).join(", ") : "#EEF0F4 0deg 360deg";
  return `
    <div class="donut-wrap">
      <div class="donut" style="background: conic-gradient(${stops});">
        <div class="donut-hole"><div class="donut-total">${total}</div><div class="donut-total-label">total</div></div>
      </div>
      <div class="donut-legend">
        ${segments.map(seg=>`<div class="legend-row${drillType?' drill':''}"${drillType?` data-drill-type="${drillType}" data-drill-key="${esc(seg.label)}"`:''}><span class="legend-dot" style="background:${seg.color}"></span>${esc(seg.label)}<b>${seg.value}</b></div>`).join("")}
      </div>
    </div>`;
}
function budgetReal(pKey){
  const items = DATA.projects[pKey].budgetItems || [];
  return items.reduce((s,it)=>s+(Number(it.monto)||0),0);
}
function esc(s){
  return (s===undefined||s===null?"":String(s)).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function opts(list, selected){
  return list.map(o=>`<option value="${esc(o)}" ${o===selected?"selected":""}>${esc(o)}</option>`).join("");
}
function projOptions(selected, onlyKeys){
  const keys = onlyKeys || Object.keys(DATA.projects);
  return keys.map(k=>`<option value="${k}" ${k===selected?"selected":""}>${esc(DATA.projects[k].name)}</option>`).join("");
}
function slugify(name){
  let base = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  if(!base) base = "proyecto";
  let key = base, i = 2;
  while(DATA.projects[key]){ key = base + "-" + i; i++; }
  return key;
}

let EJ_FILTER = "";

function computeEjecutivoData(){
  const allActiveKeys = activeProjectKeys();
  const filteredKeys = EJ_FILTER ? allActiveKeys.filter(k=>DATA.projects[k].coordinacion===EJ_FILTER) : allActiveKeys;

  let totalAct=0, comp=0, prog=0, pend=0, bloq=0;
  filteredKeys.forEach(k=>{
    const c = contarEstados(DATA.projects[k].activities);
    totalAct += DATA.projects[k].activities.length;
    comp += c["Completada"]; prog += c["En Progreso"]; pend += c["Pendiente"]; bloq += c["Bloqueada"];
  });
  const globalPct = totalAct ? (comp*1 + prog*0.5 + bloq*0.25) / totalAct : 0;

  const coordRows = COORDINACIONES.map(c=>{
    const projs = allActiveKeys.map(k=>DATA.projects[k]).filter(p=>p.coordinacion===c);
    let w=0, n=0;
    projs.forEach(p=>p.activities.forEach(a=>{ w += pesoEstado(a.estado); n++; }));
    return { coord:c, count:projs.length, pct: n ? w/n : null };
  });

  const coordBudgetRows = COORDINACIONES.map(c=>{
    const keys = allActiveKeys.filter(k=>DATA.projects[k].coordinacion===c);
    const plan = keys.reduce((s,k)=>s+(Number(DATA.projects[k].budgetPlanificado)||0),0);
    const real = keys.reduce((s,k)=>s+budgetReal(k),0);
    return {coord:c, plan, real};
  });

  const projBudgetRows = filteredKeys.map(k=>({
    key:k, name: DATA.projects[k].name, coordinacion: DATA.projects[k].coordinacion || "",
    plan: Number(DATA.projects[k].budgetPlanificado)||0, real: budgetReal(k)
  }));
  const totalPlan = filteredKeys.reduce((s,k)=>s+(Number(DATA.projects[k].budgetPlanificado)||0),0);
  const totalReal = filteredKeys.reduce((s,k)=>s+budgetReal(k),0);

  const porResp = {};
  filteredKeys.forEach(k=>{
    DATA.projects[k].activities.forEach(a=>{
      const nombre = (a.responsable||"").trim() || "Sin asignar";
      if(!porResp[nombre]) porResp[nombre] = {total:0, comp:0, prog:0, pend:0};
      porResp[nombre].total++;
      if(a.estado==="Completada") porResp[nombre].comp++;
      else if(a.estado==="En Progreso") porResp[nombre].prog++;
      else porResp[nombre].pend++;
    });
  });
  const respRows = Object.keys(porResp).map(n=>({nombre:n, ...porResp[n]})).sort((a,b)=>b.total-a.total);

  return {
    allActiveKeys, filteredKeys, totalAct, comp, prog, pend, bloq, globalPct,
    coordRows, coordBudgetRows, projBudgetRows, totalPlan, totalReal, respRows
  };
}

async function downloadDashboardPDF(){
  const btn = document.getElementById("btn-download-pdf");
  const originalLabel = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Generando PDF…"; }
  try{
    const previousTarget = CURRENT_TARGET;
    if(CURRENT_TARGET !== "ejecutivo"){ switchSection("ejecutivo"); }
    await new Promise(r=>setTimeout(r, 120));

    const el = document.getElementById("content");
    const canvas = await html2canvas(el, {scale:2, backgroundColor:"#ffffff", useCORS:true});

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const pageWidth = 210, pageHeight = 297, margin = 8;
    const usableWidth = pageWidth - margin*2;
    const imgWidth = usableWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;

    pdf.setFontSize(13);
    pdf.text("Resumen Objetivos — Fibranet", margin, margin+4);
    pdf.setFontSize(8);
    pdf.setTextColor(120);
    pdf.text(`Generado el ${new Date().toLocaleDateString("es-MX")} por ${CURRENT_USER.nombre||CURRENT_USER.username}`, margin, margin+9);
    pdf.setTextColor(0);

    const imgData = canvas.toDataURL("image/png");
    let heightLeft = imgHeight;
    let position = margin + 14;
    let firstPageUsable = pageHeight - position - margin;

    pdf.addImage(imgData, "PNG", margin, position, imgWidth, imgHeight);
    heightLeft -= firstPageUsable;

    while(heightLeft > 0){
      pdf.addPage();
      position = margin - (imgHeight - heightLeft);
      pdf.addImage(imgData, "PNG", margin, position, imgWidth, imgHeight);
      heightLeft -= (pageHeight - margin*2);
    }

    pdf.save(`dashboard-ejecutivo-fibranet-${new Date().toISOString().slice(0,10)}.pdf`);

    if(previousTarget !== "ejecutivo"){ switchSection(previousTarget); }
  }catch(err){
    console.error("Error generando PDF:", err);
    alert("No se pudo generar el PDF. Intenta de nuevo.");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

  })));

  const wsResp = XLSX.utils.json_to_sheet(D.respRows.map(r=>({
    "Responsable": r.nombre,
    "Total actividades": r.total,

    return `
      <div class="card card-proj" data-goto="proj:${pKey}" style="cursor:pointer;">

        </div>

      <div class="card">
        <p class="summary-title">Plan de acción por estado</p>
        <div>${Object.keys(accCounts).map(k=>`

            <div class="val">${accCounts[k]}</div>
          </div>`).join("")}
          <div class="footer-note">${DATA.acciones.length} acción(es) de seguimiento registradas</div>

        </div>
      </div>

  `;

        buildNav();

      });
    };

    bind("pi-resp","responsable");
    bind("pi-corresp","corresponsable");
    bind("pi-finicio","fechaInicioEsperada");
    bind("pi-ffin","fechaFinEsperada");
    bind("pi-budget","budgetPlanificado", true);

        const newName = nameInput.value.trim();

        proj.name = newName;
        saveData();
        buildNav();
        renderSubtabs(CURRENT_TARGET);
        renderSubtabs2(CURRENT_TARGET);
        renderProjectPage(pKey);
      });
    }

    tr.innerHTML = `
      <td class="idcol">${idx+1}</td>
      <td><input type="text" value="${esc(a.actividad)}" data-f="actividad" ${dis}></td>
      <td><input type="text" value="${esc(a.responsable)}" data-f="responsable" ${dis}></td>
      <td><input type="date" value="${esc(a.inicio)}" data-f="inicio" ${dis}></td>
      <td><input type="date" value="${esc(a.fin)}" data-f="fin" ${dis}></td>
      <td><select class="status-select st-${a.estado.replace(/\s/g,'')}" data-f="estado" ${dis}>${opts(ESTADOS_ACT,a.estado)}</select></td>
      <td class="pctcell">${fmtPct(p)}</td>
      <td><input type="number" min="0" max="100" step="1" value="${Number(a.ponderacion)||0}" data-f="ponderacion" title="Solo el administrador puede modificar la ponderación" ${disPond}></td>
      <td><select class="prio-${a.prioridad}" data-f="prioridad" ${dis}>${opts(PRIORIDADES,a.prioridad)}</select></td>
      <td><input type="text" value="${esc(a.notas)}" data-f="notas" ${dis}></td>
      <td><div class="evidence-cell">
        <input type="url" value="${esc(a.evidencia||'')}" data-f="evidencia" placeholder="Pegar liga…" ${dis}>
        ${hasLink ? `<button type="button" class="icon-btn" data-open="1" title="Abrir enlace">↗</button><button type="button" class="icon-btn" data-copy="1" title="Copiar enlace">⧉</button>` : ""}
      </div></td>
      ${canDelAct ? `<td><button class="rowdel" title="Eliminar actividad" data-del="${a.id}">✕</button></td>` : ""}
    `;
    tbody.appendChild(tr);

    const openBtn = tr.querySelector("[data-open]");
    if(openBtn) openBtn.addEventListener("click", ()=>{ window.open(a.evidencia, "_blank", "noopener"); });
    const copyBtn = tr.querySelector("[data-copy]");
    if(copyBtn) copyBtn.addEventListener("click", ()=>{
      navigator.clipboard.writeText(a.evidencia).then(()=>{
        copyBtn.textContent = "✓";
        setTimeout(()=>{ copyBtn.textContent = "⧉"; }, 1200);
      }).catch(()=>{ alert("No se pudo copiar el enlace."); });
    });

    if(!readonly){
      tr.querySelectorAll("[data-f]").forEach(inp=>{
        inp.addEventListener("change", ()=>{
          a[inp.dataset.f] = inp.dataset.f==="ponderacion" ? (Math.max(0,Math.min(100,Number(inp.value)||0))) : inp.value;
          saveData();
          renderProjectPage(pKey);
          buildNav();
        });
      });
      const delBtn = tr.querySelector("[data-del]");
      if(delBtn){
        delBtn.addEventListener("click", ()=>{
          if(!confirm("¿Eliminar esta actividad?")) return;
          proj.activities = proj.activities.filter(x=>x.id!==a.id);
          saveData();
          renderProjectPage(pKey);
          buildNav();
        });
      }
    }
  });

  const addBtn = document.getElementById("btn-add-act");
  if(addBtn){
    addBtn.addEventListener("click", ()=>{
      proj.activities.push({id:newId(), actividad:"Nueva actividad", responsable:"", inicio:"", fin:"", estado:"Pendiente", ponderacion:0, prioridad:"Media", notas:"", evidencia:""});
      saveData();
      renderProjectPage(pKey);
      buildNav();
    });
  }

  renderBudgetSection(proj, pKey, readonly);

  const addBudgetBtn = document.getElementById("btn-add-budget");
  if(addBudgetBtn){
    addBudgetBtn.addEventListener("click", ()=>openBudgetModal(proj, pKey));
  }
}

function renderBudgetSection(proj, pKey, readonly){
  const items = proj.budgetItems || [];
  const plan = Number(proj.budgetPlanificado)||0;
  const real = budgetReal(pKey);
  const diff = plan - real;
  const over = diff < 0;

  document.getElementById("budget-summary").innerHTML = `
    <div class="budget-pill"><label>Budget Planificado</label><div class="amt">${fmtMoney(plan)}</div></div>
    <div class="budget-pill"><label>Budget Real (ejercido)</label><div class="amt ${over?'over':''}">${fmtMoney(real)}</div></div>
    <div class="budget-pill"><label>${over?"Sobregiro":"Disponible"}</label><div class="amt ${over?'over':'under'}">${fmtMoney(Math.abs(diff))}</div></div>
  `;

  const tbody = document.getElementById("tbody-budget");
  if(items.length === 0){
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--muted); padding:20px;">Sin compras ni gastos registrados.</td></tr>`;
    return;
  }
  tbody.innerHTML = "";
  items.forEach((it, idx)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="idcol">${idx+1}</td>
      <td><span class="tipo-${it.tipo}">${esc(it.tipo)}</span></td>
      <td>${esc(it.descripcion)}</td>
      <td class="mono">${fmtMoney(it.monto)}</td>
      ${!readonly ? `<td style="text-align:right;"><button class="btn-del-row" data-del="${it.id}">Eliminar</button></td>` : ""}
    `;
    tbody.appendChild(tr);
    if(!readonly){
      tr.querySelector("[data-del]").addEventListener("click", ()=>{
        if(!confirm("¿Eliminar este registro de presupuesto?")) return;
        proj.budgetItems = proj.budgetItems.filter(x=>x.id!==it.id);
        saveData();
        renderProjectPage(pKey);
      });
    }
  });
}

function openBudgetModal(proj, pKey){
  const html = `
    <h3>Agregar compra o gasto</h3>
    <div class="modal-desc">Registra un movimiento de presupuesto para "${esc(proj.name)}".</div>
    <div class="modal-field"><label>Tipo</label><select id="bm-tipo">${opts(TIPOS_GASTO)}</select></div>
    <div class="modal-field"><label>Descripción breve</label><input type="text" id="bm-desc" placeholder="Ej. Compra de módulos SFP+"></div>
    <div class="modal-field"><label>Cantidad (MXN)</label><div class="money-input-wrap"><span class="currency-prefix">$</span><input type="number" id="bm-monto" min="0" step="100" placeholder="0"></div></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="bm-cancel">Cancelar</button>
      <button class="btn btn-primary" id="bm-submit">Agregar</button>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector("#bm-cancel").addEventListener("click", closeModal);
  overlay.querySelector("#bm-submit").addEventListener("click", ()=>{
    const desc = overlay.querySelector("#bm-desc").value.trim();
    const monto = Number(overlay.querySelector("#bm-monto").value) || 0;
    if(!desc){ alert("Agrega una descripción breve."); return; }
    if(!proj.budgetItems) proj.budgetItems = [];
    proj.budgetItems.push({id:newId(), tipo:overlay.querySelector("#bm-tipo").value, descripcion:desc, monto:monto});
    saveData();
    closeModal();
    renderProjectPage(pKey);
  });
}

/* =========================================================================
   PROYECTOS TERMINADOS
========================================================================= */
function renderTerminados(){
  const content = document.getElementById("content");
  const keys = completedProjectKeys();
  if(keys.length === 0){
    content.innerHTML = `<div class="empty-state">Todavía no hay proyectos terminados.<br>Cuando un proyecto se marque como completado, aparecerá aquí.</div>`;
    return;
  }
  const cards = keys.map(pKey=>{
    const proj = DATA.projects[pKey];
    const pct = avanceProyecto(pKey);
    const c = contarEstados(proj.activities);
    const real = budgetReal(pKey);
    const plan = Number(proj.budgetPlanificado)||0;
    const consumedPct = plan>0 ? Math.min(100, (real/plan)*100) : (real>0?100:0);
    const over = plan>0 && real>plan;
    return `
      <div class="card card-proj" data-goto="proj:${pKey}" style="cursor:pointer;">
        <div class="row-top">
          <div>
            <h3>${esc(proj.name)}</h3>
            <div class="meta">${esc(proj.responsable)} · ${esc(proj.coordinacion||"")}</div>
          </div>
          <span class="badge grey">Terminado ${proj.fechaCierre ? "· "+esc(proj.fechaCierre) : ""}</span>
        </div>
        <div class="pct-num">${fmtPct(pct)}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct*100}%; background:var(--muted)"></div></div>
        <div class="mini-stats">
          <span><b>${c["Completada"]}</b>/${proj.activities.length} actividades completadas</span>
        </div>
        <div class="mini-budget">
          <div class="row"><span>Presupuesto real</span><b style="${over?'color:var(--red);':''}">${fmtMoney(real)}</b></div>
          <div class="row"><span>Planificado</span><b>${fmtMoney(plan)}</b></div>
          <div class="track"><div class="fill" style="width:${consumedPct}%; background:${over?'var(--red)':'var(--accent)'}"></div></div>
        </div>
      </div>`;
  }).join("");
  content.innerHTML = `<div class="grid-cards">${cards}</div>`;
  content.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", ()=>switchSection(el.dataset.goto));
  });
}

    if(DATA.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ alert("Ese nombre de usuario ya existe."); return; }
    DATA.users.push({id:newId(), username, password, role: role==="editor"?"editor":"viewer", nombre: nombre || username});
    saveData();
    renderUsuarios();
  });

  document.getElementById("btn-download-backup").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const fecha = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `respaldo-fibranet-${fecha}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

/* =========================================================================
   CONEXIONES (solo admin)
========================================================================= */
function fmtDuracion(ms){
  if(ms < 0) ms = 0;
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if(h > 0) return `${h}h ${m}min`;
  return `${m} min`;
}

function renderConexiones(){
  const content = document.getElementById("content");
  if(!isAdmin()){ switchSection("dashboard"); return; }

  const ONLINE_WINDOW_MS = 5 * 60000; // si hubo heartbeat en los últimos 5 min, se considera "en línea"
  const log = DATA.connectionLog || {};

  function normalizeEntry(entry){
    if(!entry) return null;
    // compatibilidad con el formato anterior (lastLoginAt/lastActivityAt)
    return {
      sessionStart: entry.sessionStart || entry.lastLoginAt || null,
      sessionLastSeen: entry.sessionLastSeen || entry.lastActivityAt || null,
      prevSessionStart: entry.prevSessionStart || null,
      prevSessionEnd: entry.prevSessionEnd || null
    };
  }

  const filas = DATA.users.map(u=>({ user: u, entry: normalizeEntry(log[u.username]) }))
    .sort((a,b)=>{
      const ta = a.entry && a.entry.sessionLastSeen ? new Date(a.entry.sessionLastSeen).getTime() : 0;
      const tb = b.entry && b.entry.sessionLastSeen ? new Date(b.entry.sessionLastSeen).getTime() : 0;
      return tb - ta;
    });

  content.innerHTML = `
    <div class="footer-note" style="margin-bottom:10px;">"Sesión actual" muestra si el usuario está en línea ahora mismo y desde cuándo. "Sesión anterior" conserva la fecha y duración de su conexión previa, aunque ya haya vuelto a entrar — así no se pierde el dato al iniciar una nueva sesión.</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Usuario</th><th>Nombre</th><th>Rol</th>
          <th>Sesión actual</th><th>Tiempo conectado</th>
          <th>Sesión anterior</th><th>Duración sesión anterior</th>
        </tr></thead>
        <tbody id="tbody-conexiones"></tbody>
      </table>
    </div>
  `;

  const tbody = document.getElementById("tbody-conexiones");
  if(filas.length === 0){
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:24px;">Sin usuarios registrados.</td></tr>`;
    return;
  }

  const fmtFechaHora = (iso) => {
    const d = new Date(iso);
    return d.toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"}) + " " +
           d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
  };

  filas.forEach(({user, entry})=>{
    const roleClass = user.role==='admin' ? 'role-admin' : user.role==='editor' ? 'role-editor' : 'role-viewer';

    let sesionActualTxt = "—", tiempoActualTxt = "—";
    let sesionAnteriorTxt = "—", duracionAnteriorTxt = "—";

    if(entry && entry.sessionStart){
      const start = new Date(entry.sessionStart);
      const lastSeen = entry.sessionLastSeen ? new Date(entry.sessionLastSeen) : start;
      const enLinea = (Date.now() - lastSeen.getTime()) < ONLINE_WINDOW_MS;
      sesionActualTxt = (enLinea ? "🟢 En línea desde " : "Desconectado — entró ") + fmtFechaHora(entry.sessionStart);
      tiempoActualTxt = fmtDuracion(lastSeen.getTime() - start.getTime()) + (enLinea ? " (en curso)" : "");
    }

    if(entry && entry.prevSessionStart){
      sesionAnteriorTxt = fmtFechaHora(entry.prevSessionStart);
      if(entry.prevSessionEnd){
        duracionAnteriorTxt = fmtDuracion(new Date(entry.prevSessionEnd).getTime() - new Date(entry.prevSessionStart).getTime());
      }
    }

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="mono">${esc(user.username)}</td>
      <td>${esc(user.nombre||"")}</td>
      <td><span class="role-pill ${roleClass}">${roleLabel(user.role)}</span></td>
      <td class="mono">${sesionActualTxt}</td>
      <td class="mono">${tiempoActualTxt}</td>
      <td class="mono">${sesionAnteriorTxt}</td>
      <td class="mono">${duracionAnteriorTxt}</td>
    `;
    tbody.appendChild(tr);
  });
}

function seleccionarPopEnMapa(popId){
  const p = (DATA.infra.pops||[]).find(x=>String(x.id)===String(popId));

    alert("Este Pop no tiene coordenadas registradas todavía, no se puede ubicar en el mapa.");
    return;
  }

    popsMarkersById[selectedPopMarkerId].setIcon(new L.Icon.Default());
  }

const POPS_SYNC_STRING_FIELDS = ["ciudad","plaza","direccion","operador","reciboLuz","tipoOperacion","plantaCD","corrienteAlterna","bancoBaterias","generador"];

// Núcleo silencioso: agrega Pops del catálogo que no existan (por nombre) y completa
// campos vacíos de los que ya existen. NUNCA sobrescribe un valor ya capturado o editado
// a mano — es seguro llamarlo automáticamente en cada carga de la app (migrateData) y
// también bajo demanda desde el botón "Sincronizar catálogo de Pops".
function syncPopsFromCatalogCore(){
  if(!DATA.infra.pops) DATA.infra.pops = [];
  const existentes = DATA.infra.pops;
  const norm = s => (s||"").toString().trim().toLowerCase();
  let agregados = 0, actualizados = 0;

  POPS_IMPORT_SEED.forEach(seed=>{
    const match = existentes.find(p=>norm(p.nombre)===norm(seed.nombre));
    if(!match){
      const nuevo = Object.assign({id:newId(), tipo:"Acceso", estado:"Activo", responsable:""}, seed);
      existentes.push(nuevo);
      agregados++;
      return;
    }
    let tocado = false;
    POPS_SYNC_STRING_FIELDS.forEach(f=>{
      if(!match[f] && seed[f]){ match[f] = seed[f]; tocado = true; }
    });
    if((match.lat===null || match.lat===undefined) && seed.lat!==null && seed.lat!==undefined){ match.lat = seed.lat; tocado = true; }
    if((match.lng===null || match.lng===undefined) && seed.lng!==null && seed.lng!==undefined){ match.lng = seed.lng; tocado = true; }
    if(!match.capacidadRacks && seed.capacidadRacks){ match.capacidadRacks = seed.capacidadRacks; tocado = true; }
    if(tocado) actualizados++;
  });

  return {agregados, actualizados};
}

// Acción manual (botón) — igual que el núcleo automático, pero con confirmación y aviso
// para cuando el administrador quiera forzar una re-sincronización a mano (por ejemplo
// después de que yo actualice el catálogo con un Excel nuevo).
function sincronizarPopsDesdeCatalogo(){
  if(!canEdit()) return;
  if(!confirm(
    "Esto agregará al catálogo los Pops del Excel que aún no existan (comparando por nombre) y completará los campos vacíos de los que ya existen, sin sobrescribir información que ya hayas capturado o corregido manualmente.\n\n¿Continuar?"
  )) return;

  const {agregados, actualizados} = syncPopsFromCatalogCore();
  if(agregados===0 && actualizados===0){
    alert("El catálogo de Pops ya está sincronizado: no había sitios nuevos ni campos vacíos por completar.");
    return;
  }
  saveData();
  renderPops();
  alert(`Sincronización completa.\nPops agregados: ${agregados}\nPops con campos completados: ${actualizados}`);
}

/* =========================================================================
   INFRAESTRUCTURA — GENERADORES DE EMERGENCIA
   (misma arquitectura que Aires Acondicionados: catálogo por sitio Pop +
   historial de mantenimientos con costo, proveedor, supervisor y adjunto)
========================================================================= */
function generadorLabel(g){
  const partes = [popNombre(g.popId)];
  if(g.ubicacion) partes.push(g.ubicacion);
  const marcaModelo = [g.marca, g.modelo].filter(Boolean).join(" ");
  let label = partes.join(" — ");
  if(marcaModelo) label += ` (${marcaModelo})`;
  return label;
}
function generadorOptions(selectedId){
  const list = DATA.infra.generadores || [];
  if(list.length===0) return `<option value="">— No hay generadores registrados —</option>`;
  return `<option value="">Selecciona un generador…</option>` + list.map(g=>
    `<option value="${g.id}" ${String(g.id)===String(selectedId)?"selected":""}>${esc(generadorLabel(g))}</option>`
  ).join("");
}
function estadoGenerador(g){
  if(!g.fechaUltimoMantenimiento) return {cls:"grey", label:"Sin mantenimiento registrado"};
  if(!g.proximoMantenimientoRecomendado) return {cls:"grey", label:"Sin próxima fecha"};
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const prox = new Date(g.proximoMantenimientoRecomendado+"T00:00:00");
  const days = Math.round((prox - hoy) / 86400000);
  if(days < 0) return {cls:"red", label:`Vencido hace ${Math.abs(days)} día(s)`};
  if(days <= 30) return {cls:"amber", label: days===0 ? "Vence hoy" : `Vence en ${days} día(s)`};
  return {cls:"green", label:"Al día"};
}
function recomputeGeneradorFromHistory(generadorId){
  const g = (DATA.infra.generadores||[]).find(x=>String(x.id)===String(generadorId));
  if(!g) return;
  const hist = (DATA.infra.mantenimientosGeneradores||[]).filter(x=>String(x.generadorId)===String(generadorId));
  if(hist.length===0){
    g.fechaUltimoMantenimiento = "";
    g.proximoMantenimientoRecomendado = g.fechaInstalacion ? addDaysISO(g.fechaInstalacion, g.frecuenciaRecomendadaDias||90) : "";
    g.ultimasAcciones = "";
    g.ultimasObservaciones = "";
    return;
  }
  hist.sort((a,b)=> (a.fecha||"").localeCompare(b.fecha||""));
  const last = hist[hist.length-1];
  g.fechaUltimoMantenimiento = last.fecha || "";
  g.ultimasAcciones = accionesDisplay(last);
  g.ultimasObservaciones = last.observaciones || "";
  g.proximoMantenimientoRecomendado = last.proximoMantenimientoRecomendado || addDaysISO(last.fecha, g.frecuenciaRecomendadaDias||90);
  g.fechaSugerida = false;
}

function renderGeneradores(){
  const content = document.getElementById("content");
  const editable = canEdit();
  const generadores = DATA.infra.generadores || [];
  const historial = DATA.infra.mantenimientosGeneradores || [];

  const vencidos = generadores.filter(g=>estadoGenerador(g).cls==="red").length;
  const proximos = generadores.filter(g=>estadoGenerador(g).cls==="amber").length;
  const sinRegistro = generadores.filter(g=>estadoGenerador(g).cls==="grey").length;
  const costoTotal = historial.reduce((s,h)=>s+(Number(h.costo)||0),0);
  const anioActual = new Date().getFullYear();
  const costoAnioActual = historial.reduce((s,h)=>{
    const anio = h.fecha ? Number(h.fecha.slice(0,4)) : null;
    return s + (anio===anioActual ? (Number(h.costo)||0) : 0);
  }, 0);

  content.innerHTML = `
    <div class="budget-summary">
      <div class="budget-pill"><label>Generadores registrados</label><div class="amt">${generadores.length}</div></div>
      <div class="budget-pill"><label>Mantenimiento vencido</label><div class="amt ${vencidos>0?'over':''}">${vencidos}</div></div>
      <div class="budget-pill"><label>Próximos a vencer (≤30 días)</label><div class="amt ${proximos>0?'warn':''}">${proximos}</div></div>
      <div class="budget-pill"><label>Sin mantenimiento registrado</label><div class="amt">${sinRegistro}</div></div>
      <div class="budget-pill"><label>Servicios registrados</label><div class="amt">${historial.length}</div></div>
      <div class="budget-pill"><label>Costo invertido (${anioActual})</label><div class="amt">${fmtMoney(costoAnioActual)}</div></div>
      <div class="budget-pill"><label>Costo invertido (histórico)</label><div class="amt">${fmtMoney(costoTotal)}</div></div>
    </div>
    <div class="footer-note" style="margin-bottom:10px;">Haz clic en "Historial" para ver todos los servicios de un generador, su costo, proveedor, supervisor y el reporte adjunto.</div>
    <div class="table-wrap tall">
      <table>
        <thead><tr>
          <th>#</th><th style="min-width:170px;">Sitio (Pop)</th><th>Marca / Modelo</th><th>Capacidad</th>
          <th>Fecha último mantenimiento</th><th style="min-width:200px;">Últimas acciones realizadas</th>
          <th style="min-width:180px;">Observaciones</th><th>Próximo mantenimiento recomendado</th><th>Estado</th><th></th>
        </tr></thead>
        <tbody id="tbody-generadores"></tbody>
      </table>
    </div>
  `;

  const tbody = document.getElementById("tbody-generadores");
  if(generadores.length===0){
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:var(--muted); padding:24px;">Sin generadores registrados.${editable?' Usa "+ Agregar Generador" para comenzar.':''}</td></tr>`;
    return;
  }

  generadores.forEach((g, idx)=>{
    const st = estadoGenerador(g);
    const marcaModelo = [g.marca, g.modelo].filter(Boolean).join(" ") || "—";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="idcol">${idx+1}</td>
      <td><b>${esc(popNombre(g.popId))}</b>${g.ubicacion?`<br><span class="footer-note" style="margin:0;">${esc(g.ubicacion)}</span>`:""}</td>
      <td>${esc(marcaModelo)}</td>
      <td>${esc(g.capacidad||"—")}</td>
      <td class="mono">${fmtFechaCorta(g.fechaUltimoMantenimiento)}</td>
      <td>${esc(g.ultimasAcciones||"—")}</td>
      <td>${esc(g.ultimasObservaciones||"—")}</td>
      <td class="mono">${fmtFechaCorta(g.proximoMantenimientoRecomendado)}</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td style="white-space:nowrap;">
        <button class="link-btn" data-hist="1">Historial</button>
        ${editable ? `<button class="link-btn" data-edit="1">Editar</button>` : ""}
        ${editable ? `<button class="link-btn" style="color:var(--red);" data-del="1">Eliminar</button>` : ""}
      </td>
    `;
    tbody.appendChild(tr);
    tr.querySelector("[data-hist]").addEventListener("click", ()=>openHistorialGeneradorModal(g));
    const editBtn = tr.querySelector("[data-edit]");
    if(editBtn) editBtn.addEventListener("click", ()=>openGeneradorModal(g));
    const delBtn = tr.querySelector("[data-del]");
    if(delBtn) delBtn.addEventListener("click", ()=>{
      if(!confirm(`¿Eliminar el generador de "${popNombre(g.popId)}"${g.ubicacion?' — '+g.ubicacion:''}? También se eliminará su historial de mantenimientos.`)) return;
      DATA.infra.generadores = DATA.infra.generadores.filter(x=>x.id!==g.id);
      DATA.infra.mantenimientosGeneradores = DATA.infra.mantenimientosGeneradores.filter(x=>x.generadorId!==g.id);
      saveData();
      renderGeneradores();
    });
  });
}

    <div class="modal-field"><label>Generador</label><select id="gmm-generador">${generadorOptions(generadorIdPreset)}</select></div>

        `).join("")}

        <datalist id="gmm-supervisor-list">${usuariosNombres.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
      </div>
    </div>
    <div class="modal-field"><label>Próxima fecha recomendada</label><input type="date" id="gmm-proxima" value="${addDaysISO(hoy,90)}"></div>
    <div class="modal-field"><label>Observaciones</label><textarea id="gmm-obs" rows="3" placeholder="Hallazgos, condición del equipo, recomendaciones…"></textarea></div>
    <div class="modal-field">
      <label>Adjuntar evidencia / reporte de mantenimiento</label>
      <div class="file-drop">
        <label class="btn upload-btn-label" style="margin:0;">
          ⬆ Elegir archivo (PDF o imagen)
          <input type="file" id="gmm-file" accept=".pdf,.jpg,.jpeg,.png" style="display:none;">
        </label>
        <span id="gmm-file-name" style="margin-left:8px; color:var(--muted); font-size:12px;">Ningún archivo seleccionado.</span>
      </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="gmm-cancel">Cancelar</button>

    </div>
  `;

  const overlay = openModal(html, "wide");
  overlay.querySelector("#gmm-cancel").addEventListener("click", closeModal);

  const otroChk = overlay.querySelector('.gmm-accion[value="Otro"]');
  const otroInput = overlay.querySelector("#gmm-otro");
  if(otroChk){
    otroChk.addEventListener("change", ()=>{ otroInput.style.display = otroChk.checked ? "block" : "none"; });
  }

  function updateProximaSugerida(){
    const fecha = overlay.querySelector("#gmm-fecha").value;
    const generadorId = overlay.querySelector("#gmm-generador").value;
    const g = list.find(x=>String(x.id)===String(generadorId));
    const dias = g ? (g.frecuenciaRecomendadaDias||90) : 90;
    if(fecha) overlay.querySelector("#gmm-proxima").value = addDaysISO(fecha, dias);
  }
  overlay.querySelector("#gmm-fecha").addEventListener("change", updateProximaSugerida);
  overlay.querySelector("#gmm-generador").addEventListener("change", updateProximaSugerida);

  let selectedFile = null;
  overlay.querySelector("#gmm-file").addEventListener("change", (e)=>{
    selectedFile = e.target.files[0] || null;
    overlay.querySelector("#gmm-file-name").textContent = selectedFile ? `${selectedFile.name} (${Math.round(selectedFile.size/1024)} KB)` : "Ningún archivo seleccionado.";
  });

  overlay.querySelector("#gmm-submit").addEventListener("click", async ()=>{
    const generadorId = overlay.querySelector("#gmm-generador").value;
    if(!generadorId){ alert("Selecciona el generador al que corresponde este mantenimiento."); return; }
    const fecha = overlay.querySelector("#gmm-fecha").value;
    if(!fecha){ alert("La fecha del mantenimiento es obligatoria."); return; }

    const acciones = Array.from(overlay.querySelectorAll(".gmm-accion:checked")).map(c=>c.value);
    const accionesOtro = overlay.querySelector("#gmm-otro").value.trim();
    if(acciones.includes("Otro") && !accionesOtro){
      alert('Especifica la acción realizada en el campo de "Otro".');
      return;
    }

    const submitBtn = overlay.querySelector("#gmm-submit");
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;

    const rec = {
      id: newId(),
      generadorId,
      fecha,
      tipoServicio: overlay.querySelector("#gmm-tipo").value,
      acciones,
      accionesOtro,
      costo: Number(overlay.querySelector("#gmm-costo").value)||0,
      moneda: overlay.querySelector("#gmm-moneda").value,
      proveedor: overlay.querySelector("#gmm-proveedor").value.trim(),
      supervisorFibranet: overlay.querySelector("#gmm-supervisor").value.trim(),
      proximoMantenimientoRecomendado: overlay.querySelector("#gmm-proxima").value,
      observaciones: overlay.querySelector("#gmm-obs").value.trim(),
      adjuntoNombre: "", adjuntoUrl: "",
      registradoPor: CURRENT_USER.nombre || CURRENT_USER.username,
      registradoEn: new Date().toISOString()
    };

    if(selectedFile){
      submitBtn.textContent = "Subiendo archivo…";
      try{
        const path = `mantenimientos-generadores/${rec.id}-${selectedFile.name}`;
        const snap = await storage.ref(path).put(selectedFile);
        const url = await snap.ref.getDownloadURL();
        rec.adjuntoNombre = selectedFile.name;
        rec.adjuntoUrl = url;
      }catch(err){
        console.error("Error subiendo adjunto a Firebase Storage:", err);
        const seguir = confirm(
          "No se pudo subir el archivo adjunto (verifica que las reglas de Firebase Storage permitan escritura). " +
          "¿Deseas guardar el mantenimiento SIN el archivo adjunto? Cancelar para intentar de nuevo."
        );
        if(!seguir){
          submitBtn.disabled = false;
          submitBtn.textContent = originalLabel;
          return;
        }
      }
    }

    DATA.infra.mantenimientosGeneradores.push(rec);
    recomputeGeneradorFromHistory(generadorId);
    saveData();
    closeModal();
    renderGeneradores();
  });
}
